<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网约车物语 V14.89</title>
<style>
  /* ========= 字体系统:全部使用清晰系统中文黑体 ========= */
  :root {
    --bg: #F4E4BC;            /* 暖黄大地色(开罗风) */
    --bg-deep: #E5D29F;
    --card: #FFF8E7;          /* 奶白卡片 */
    --sub: #F0E2BC;           /* 子背景 - 与 bg 相近 */
    --ink: #2A2320;            /* 深棕 - 文字主色 */
    --ink-1: var(--ink);       /* 兜底:历史多处误用 --ink-1,统一回落到 --ink */
    --ink-2: #6D635A;
    --ink-3: #9A8C7E;
    --accent: #FF8C42;         /* 亮橙 - 主色饱和 */
    --accent-soft: #FFE0B8;
    --accent-deep: #D4621F;
    --green: #5FAD41;          /* 草绿 - 完单/收益色 */
    --green-soft: #D6EBC4;
    --warn: #E84545;           /* 警告红 */
    --blue: #4A90E2;
    --purple: #8B5CF6;
    --gold: #FFD93D;           /* 金币色 - 高亮 */
    --border: #2A2320;         /* 硬边框深棕 */
    --border-soft: rgba(42,35,32,0.18);
    --hairline: rgba(42,35,32,0.10);
    --line-ui: rgba(42,35,32,0.28);
    --ui-radius: 2px;
    /* 硬阴影(像素风,无 blur) */
    --shadow-sm: 2px 2px 0 var(--border-soft);
    --shadow-md: 3px 3px 0 var(--border-soft), 0 8px 20px rgba(42,35,32,0.15);
    --shadow-hard: 3px 3px 0 var(--border);
    --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden; /* 游戏一屏定型,禁止页面滚动 */
  }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.6;
    letter-spacing: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: auto;
    text-rendering: optimizeLegibility;
    /* 整体淡纹理背景模拟像素地图 */
    background-image:
      repeating-linear-gradient(0deg, transparent 0, transparent 16px, rgba(42,35,32,0.025) 16px, rgba(42,35,32,0.025) 17px),
      repeating-linear-gradient(90deg, transparent 0, transparent 16px, rgba(42,35,32,0.025) 16px, rgba(42,35,32,0.025) 17px);
  }
  * {
    letter-spacing: 0;
  }
  /* 装饰位:改为系统中文黑体,优先保证识别度 */
  .topbar h1, .game-time-main,
  .ts-label, .ts-sub,
  .speed-btn,
  .mb-tag, .mb-title,
  .ck-label,
  .compact-card .cc-name, .compact-card .vc-name,
  .cc-badge,
  .drawer-header-title,
  .modal-tag, .modal-title,
  .tut-tag, .tut-title,
  .ending-title,
  .recruit-name,
  .shop-name,
  .training-card-name,
  .drawer-train-name,
  .dco-name,
  .game-feedback-tag, .game-feedback-title,
  .panel-title,
  .event-mini-label, .event-mini-btn, .event-mini-time,
  .oc-name,
  .pixel, .pixel * {
    font-family: var(--font-body) !important;
    -webkit-font-smoothing: antialiased !important;
    -moz-osx-font-smoothing: auto !important;
    letter-spacing: 0 !important;
    font-weight: 700 !important;
  }
  /* 数字/金额/短标签:同样使用系统中文黑体,避免像素字体发糊 */
  .ts-value,
  .ck-value,
  .float-gain,
  .modal-tag, .modal-title,
  .game-feedback-tag, .game-feedback-title, .game-feedback-reward,
  .ending-title, .ending-stat-value, .ending-stat-label,
  .recruit-price,
  .shop-price,
  .training-card-cost,
  .drawer-train-cost,
  .dco-fare,
  .stat-bar-num,
  .stat-bar-label,
  .oc-fare,
  .oc-time {
    font-family: var(--font-body) !important;
    -webkit-font-smoothing: antialiased !important;
    -moz-osx-font-smoothing: auto !important;
    letter-spacing: 0 !important;
    font-weight: 700 !important;
  }
  /* 正文位置:回到系统中文黑体,优先保证识别度 */
  .mb-hint, .cc-sub, .vc-meta, .vc-driver,
  .modal-desc, .recruit-desc, .shop-meta,
  .tut-text, .tut-tip,
  .log-text, .log-time,
  .training-card-preview,
  .drawer-header-sub, .panel-sub {
    font-family: var(--font-body) !important;
    font-size: 14px !important;
    line-height: 1.65 !important;
  }
  #root {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    font-size: inherit;
    color: inherit;
  }
  button:disabled { cursor: not-allowed; opacity: 0.4; }

  /* ========= 占位元素 (后续替换为图片) ========= */
  .ph-avatar {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
    letter-spacing: 0;
    position: relative;
    overflow: hidden;
  }
  .ph-avatar img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    image-rendering: pixelated;
  }
  .ph-vehicle {
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
    text-align: center;
    line-height: 1;
    letter-spacing: 0.5px;
    position: relative;
    overflow: visible;
  }
  .ph-vehicle.asset-vehicle {
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    border-radius: 0;
  }
  .ph-vehicle.asset-vehicle::before {
    content: none;
  }
  .ph-vehicle img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    image-rendering: pixelated;
  }  .ph-vehicle::before {
    content: "";
    position: absolute;
    left: 18%;
    right: 20%;
    top: -18%;
    height: 42%;
    background: color-mix(in srgb, currentColor 24%, white 76%);
    border: 2px solid var(--ink);
    border-bottom: 0;
    border-radius: 3px 3px 0 0;
  }  /* V14.9: .vehicle-han_ev / .vehicle-odyssey 已删除 — V13 砍掉了汉EV/奥德赛 */
  .ph-order-dot {
    display: inline-block;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .ph-stat {
    display: inline-block;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .ph-clock {
    width: 92px;
    height: 36px;
    border-radius: 3px;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    column-gap: 6px;
    align-items: center;
    justify-content: start;
    flex-shrink: 0;
    font-weight: 700;
    transition: background 0.4s;
    padding: 4px 8px;
    background: #FFF7E6;
    color: var(--ink);
    line-height: 1;
  }
  .ph-clock.night {
    background: #2A2320;
    color: #FFF8E7;
  }  .ph-clock.night .clock-label {
    color: rgba(255,248,231,0.66);
  }
  .clock-time {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0;
  }  .ph-clock.night .clock-period {
    color: rgba(255,248,231,0.76);
  }
  /* ========= 顶栏 ========= */
  .topbar {
    height: 70px;
    background: #FFF8E7;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: minmax(170px, 1fr) minmax(640px, 760px) minmax(150px, 1fr);
    align-items: center;
    padding: 0 16px;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    grid-column: 1;
  }
  .topbar h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0;
    flex-shrink: 0;
  }
  .topbar h1 .v {
    font-size: 14px;
    color: var(--ink-3);
    font-weight: 500;
    margin-left: 4px;
  }  .topbar-stats {
    display: contents;
  }
  .topbar-kpis {
    display: grid;
    grid-template-columns: minmax(150px, 1.15fr) repeat(3, minmax(118px, 1fr));
    gap: 6px;
    min-width: 0;
    width: 100%;
    max-width: 760px;
    justify-content: center;
    justify-self: center;
    grid-column: 2;
  }
  .topbar-settings {
    display: flex;
    align-items: center;
    gap: 6px;
    justify-self: end;
    grid-column: 3;
  }  .topbar-clock .ph-clock {
    height: 34px;
    width: 96px;
    padding: 4px 7px;
  }
  .ts-stat {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
    min-width: 0;
  }
  .topbar-stat {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: baseline;
    column-gap: 8px;
    row-gap: 2px;
    background: var(--sub);
    border: 1px solid var(--border-soft);
    min-height: 44px;
    padding: 6px 9px;
    box-shadow: 1px 1px 0 rgba(42,35,32,0.10);
  }
  .topbar-stat .ts-label { grid-column: 1; }
  .topbar-stat .ts-value { grid-column: 2; }
  .topbar-stat .ts-sub {
    grid-column: 1 / -1;
    margin-top: 0;
    font-size: 11px;
    line-height: 1;
  }
  .ts-label {
    font-size: 14px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 600;
  }
  .ts-value {
    font-size: 18px;
    font-weight: 800;
    margin-top: 0;
    letter-spacing: 0;
  }
  .ts-value.accent { color: var(--accent); }
  .ts-value.green { color: var(--green); }
  .ts-value.time-value,
  .ts-value.supply-value {
    color: var(--ink);
    font-size: 18px;
  }
  .ts-value.supply-idle { color: var(--ink-3); }
  .ts-value.supply-balanced { color: var(--green); }
  .ts-value.supply-oversupply { color: var(--ink-2); }
  .ts-value.supply-tight { color: var(--accent-deep); }
  .ts-value.supply-undersupply { color: var(--warn); }  .ts-sub {
    font-size: 14px;
    color: var(--ink-3);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .speed-controls {
    display: flex;
    align-items: center;
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 0;
    padding: 4px;
    gap: 4px;
    box-shadow: 2px 2px 0 rgba(42,35,32,0.28);
  }
  .speed-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 11px;
    border: 1px solid rgba(42,35,32,0.58);
    border-radius: 0;
    background: var(--sub);
    font-size: 14px;
    font-weight: 900;
    color: var(--ink-2);
    transition: all 0.15s;
    min-width: 38px;
    min-height: 31px;
    white-space: nowrap;
    line-height: 1;
    cursor: pointer;
  }
  .speed-btn.play-toggle {
    min-width: 88px;
    background: var(--ink);
    border-color: var(--ink);
    color: var(--gold);
    font-weight: 900;
  }
  .speed-btn.active {
    background: var(--gold);
    color: var(--accent);
    border-color: var(--ink);
    box-shadow: inset 0 -2px 0 rgba(42,35,32,0.16);
  }
  .speed-btn:hover:not(.active):not(:disabled) {
    color: var(--ink);
    transform: translate(-1px, -1px);
    box-shadow: 2px 2px 0 rgba(42,35,32,0.22);
  }
  .speed-btn.play-toggle:hover:not(.active):not(:disabled) {
    background: var(--ink);
    color: var(--gold);
  }
  .speed-controls.is-paused {
    background: color-mix(in srgb, var(--gold) 15%, var(--card) 85%);
  }
  .speed-controls.is-first-start {
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 0;
  }
  /* 首次开局只保留一个主 CTA,避免倍速在新手第一步抢注意力 */
  .speed-controls.is-cta {
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 0;
  }
  .speed-btn.play-toggle.is-cta,
  .speed-btn.play-toggle.is-first-start {
    background: var(--accent);
    color: #FFF8E7;
    font-size: 18px;
    min-width: 156px;
    min-height: 42px;
    padding: 9px 18px;
    border: 2px solid var(--ink);
    border-radius: 0;
    box-shadow: 3px 3px 0 rgba(42,35,32,0.42);
    animation: cta-pulse 1.6s ease-in-out infinite;
  }
  .speed-btn.play-toggle.is-first-start {
    flex-direction: column;
    gap: 3px;
    min-width: 176px;
    min-height: 54px;
    padding: 9px 22px 8px;
  }
  .run-btn-main,
  .run-btn-sub {
    display: block;
    line-height: 1;
    letter-spacing: 0;
  }
  .run-btn-main {
    font-size: 18px;
    font-weight: 900;
  }
  .run-btn-sub {
    font-size: 11px;
    font-weight: 800;
    color: rgba(255,255,255,0.86);
  }
  .speed-btn.play-toggle.is-cta:hover,
  .speed-btn.play-toggle.is-first-start:hover {
    background: var(--accent);
    color: #FFF8E7;
    filter: brightness(1.06);
  }
  .speed-btn.is-dimmed {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .speed-btn.is-dimmed:hover {
    background: transparent;
    color: var(--ink-2);
  }
  @keyframes cta-pulse {
    0%, 100% { box-shadow: 3px 3px 0 rgba(42,35,32,0.42), 0 0 0 rgba(255, 107, 53, 0); }
    50%      { box-shadow: 3px 3px 0 rgba(42,35,32,0.42), 0 0 0 4px rgba(255, 107, 53, 0.2); }
  }  .col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    min-width: 0;
  }
  .panel {
    background: var(--card);
    border-radius: 2px;
    padding: 14px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0;
  }
  .panel-sub {
    font-size: 14px;
    color: var(--ink-3);
  }  .dc.selected { border-color: var(--accent); background: var(--accent-soft); }  .stat-bars {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 8px;
  }
  .stat-bar-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    min-width: 0;
  }
  .stat-bar-label {
    width: 34px;
    font-weight: 600;
    flex-shrink: 0;
    white-space: nowrap;
    line-height: 1;
  }
  .stat-bars.compact .stat-bar-label {
    width: 16px;
  }
  .stat-bar-track {
    flex: 1;
    min-width: 32px;
    height: 6px;
    background: rgba(0,0,0,0.05);
    border-radius: 3px;
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    width: 100%;
    transform-origin: left center;
    border-radius: 3px;
    transition: transform 0.4s ease;
  }
  .stat-bar-num {
    width: 28px;
    text-align: right;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }  /* 城市面板 */
  .city-panel {
    padding: 0;
    overflow: hidden;
    flex: 1; /* V3 一屏化:撑满主区剩余空间 */
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .city-panel .panel-header {
    padding: 12px 14px 8px;
    margin-bottom: 0;
    flex-shrink: 0;
  }
  .city-wrap {
    flex: 1; /* 撑满 */
    min-height: 180px;
    background: linear-gradient(135deg, #FFF8EE, #FAF0E0);
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    position: relative;
    overflow: hidden;
  }
  .city-map-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .map-run-controls {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    z-index: 18;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    background: rgba(255,248,231,0.94);
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 rgba(42,35,32,0.32);
  }
  .map-run-controls .speed-controls {
    background: var(--card);
  }
  .map-run-controls .speed-controls.is-cta,
  .map-run-controls .speed-controls.is-first-start {
    background: transparent;
  }
  .map-run-controls .hud-end-btn {
    height: 34px;
  }
  .map-run-controls.is-first-start {
    padding: 0;
    background: transparent;
    border: 0;
    box-shadow: none;
  }  .city-map-svg .district {
    cursor: pointer;
    outline: none;
  }
  .city-map-svg .district polygon,
  .city-map-svg .district circle {
    transition: stroke-width 0.12s ease, opacity 0.12s ease, filter 0.12s ease;
  }
  .city-income-pop {
    pointer-events: none;
    transform-box: fill-box;
    transform-origin: center;
  }
  .city-map-vehicle-image {
    image-rendering: pixelated;
    filter: drop-shadow(0.45px 0.75px 0 rgba(42,35,32,0.50));
  }
  .city-car-driver-badge circle {
    fill: rgba(255,248,231,0.96);
    stroke: rgba(42,35,32,0.72);
    stroke-width: 0.28;
  }
  .city-car-driver-badge text {
    fill: var(--ink);
    font-weight: 900;
    letter-spacing: 0;
  }
  .city-income-pop text {
    fill: var(--accent);
    stroke: rgba(42,35,32,0.84);
    stroke-width: 0.58;
    paint-order: stroke;
    font-weight: 900;
    letter-spacing: 0;
  }
  .city-income-pop {
    animation: cityIncomePop 1.65s cubic-bezier(0.2, 0.75, 0.2, 1) forwards;
    filter: drop-shadow(0.8px 0.8px 0 rgba(42,35,32,0.28));
  }
  @keyframes cityIncomePop {
    0% { opacity: 0; transform: translateY(0) scale(0.76); }
    14% { opacity: 1; transform: translateY(-1.2px) scale(1); }
    78% { opacity: 1; transform: translateY(-7px) scale(1); }
    100% { opacity: 0; transform: translateY(-11px) scale(0.92); }
  }  .order-ticket.selected {
    background: var(--gold);
    border-color: var(--ink) !important;
    box-shadow: 3px 3px 0 var(--accent-deep);
  }  .log-row {
    display: flex;
    gap: 10px;
    font-size: 14px;
    line-height: 1.5;
  }
  .log-row.latest {
    background: rgba(255,217,61,0.18);
    outline: 1px solid rgba(42,35,32,0.12);
    padding: 2px 4px;
    margin: -2px -4px 0;
  }
  .log-time {
    color: var(--ink-3);
    flex-shrink: 0;
    width: 60px;
    font-variant-numeric: tabular-nums;
  }
  .log-text { color: var(--ink-2); }
  .log-row.success .log-text { color: var(--green); }
  .log-row.warn .log-text { color: var(--warn); }
  .log-row.event .log-text { color: var(--accent-deep); font-weight: 600; }  /* ========= 通用按钮 ========= */
  .btn {
    padding: 8px 14px;
    border-radius: 3px;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .btn-ghost {
    background: #FFF8E7;
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover:not(:disabled) {
    background: var(--sub);
  }
  .btn-block { width: 100%; }
  .btn-sm { padding: 6px 10px; font-size: 14px; }
  .btn-xs { padding: 4px 9px; font-size: 14px; border-radius: 2px; }
  /* ========= 弹窗 ========= */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(40,25,15,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal {
    background: #FFF8E7;
    border-radius: 2px;
    padding: 24px;
    max-width: 520px;
    width: 100%;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    box-shadow: var(--shadow-md);

  /* V14.61: 复古滤镜亮度修正 — 保留线条和纹理,避免整体压暗 */
  body.crt-on::before,
  body.crt-on::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  body.crt-on::before {
    z-index: 9998;
    background:
      radial-gradient(ellipse at center, transparent 58%, rgba(42, 35, 32, 0.055) 100%),
      radial-gradient(rgba(42, 35, 32, 0.055) 0.8px, transparent 1px);
    background-size: auto, 4px 4px;
    mix-blend-mode: normal;
    opacity: 0.42;
  }
  body.crt-on::after {
    z-index: 9999;
    background:
      repeating-linear-gradient(
        0deg,
        rgba(42, 35, 32, 0.052) 0,
        rgba(42, 35, 32, 0.052) 1px,
        transparent 1px,
        transparent 4px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(42, 35, 32, 0.032) 0,
        rgba(42, 35, 32, 0.032) 1px,
        transparent 1px,
        transparent 6px
      );
    mix-blend-mode: normal;
    opacity: 0.65;
  }

/* V5 实时同步:从 localStorage 加载后台覆盖配置 */
(function() {
  function hasFunctionDeep(value) {
    if (typeof value === 'function') return true;
    if (!value || typeof value !== 'object') return false;
    if (Array.isArray(value)) return value.some(hasFunctionDeep);
    return Object.keys(value).some((key) => hasFunctionDeep(value[key]));
  }

  function mergeConfigValue(orig, ov) {
    if (ov === undefined) return orig;
    if (typeof orig === 'function') return orig;
    if (Array.isArray(orig) && Array.isArray(ov)) {
      const hasIdItems = ov.some((item) => item && typeof item === 'object' && item.id !== undefined);
      const origHasIdItems = orig.some((item) => item && typeof item === 'object' && item.id !== undefined);
      if (hasIdItems && origHasIdItems) {
        const next = orig.slice();
        ov.forEach((newItem) => {
          if (!newItem || typeof newItem !== 'object' || newItem.id === undefined) return;
          const idx = next.findIndex((x) => x && x.id === newItem.id);
          if (idx >= 0) next[idx] = mergeConfigValue(next[idx], newItem);
        });
        return next;
      }
      if (hasFunctionDeep(orig)) {
        return orig.map((item, idx) => mergeConfigValue(item, ov[idx]));
      }
      return ov.slice();
    }
    if (orig && ov && typeof orig === 'object' && typeof ov === 'object') {
      const next = { ...orig };
      Object.keys(ov).forEach((key) => {
        next[key] = mergeConfigValue(orig[key], ov[key]);
      });
      return next;
    }
    return ov;
  }

  try {
    const saved = JSON.parse(localStorage.getItem('wycwy-config-override') || 'null');
    if (!saved || !window.WYCWY_DATA) return;
    Object.keys(saved).forEach((key) => {
      if (window.WYCWY_DATA[key] === undefined) return;
      window.WYCWY_DATA[key] = mergeConfigValue(window.WYCWY_DATA[key], saved[key]);
    });
    const minFares = (window.WYCWY_DATA.GAME && window.WYCWY_DATA.GAME.MIN_ORDER_FARES) || {};
    if (Array.isArray(window.WYCWY_DATA.ORDERS)) {
      window.WYCWY_DATA.ORDERS = window.WYCWY_DATA.ORDERS.map((order) => {
        const minFare = minFares[order.id];
        return minFare ? { ...order, fare: Math.max(order.fare || 0, minFare) } : order;
      });
    }
    console.log('[WYCWY] 已加载后台覆盖配置');
  } catch (e) { console.error('[WYCWY] 配置覆盖加载失败:', e); }
})();

/* ============== 数字滚动 hook ============== */
function useCountUp(target, duration = 400) {
  const [val, setVal] = useState(target);
  const ref = useRef({ from: target, to: target, start: 0 });
  useEffect(() => {
    if (val === target) return;
    ref.current = { from: val, to: target, start: performance.now() };
    let raf;
    const step = (now) => {
      const t = Math.min(1, (now - ref.current.start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const cur = Math.round(ref.current.from + (ref.current.to - ref.current.from) * eased);
      setVal(cur);
      if (t < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return val;
}

// V12.2: 导出诊断数据 — 玩家卡住时点这个按钮下载 JSON,提交给开发者分析
function exportGameDiagnostics(state) {
  const payload = buildGameDiagnosticsPayload(state);
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  a.href = url;
  a.download = `wycwy-diagnostics-day${state.day}-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildRunRecord(state) {
  const payload = buildGameDiagnosticsPayload(state, { savedReason: 'game-over' });
  return {
    id: `run-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    savedAt: payload.exportedAt,
    version: APP_VERSION,
    result: state.gameOver?.type || 'unknown',

    summary: payload.summary,
    drivers: payload.drivers,
    vehicles: payload.vehicles,
    monthly: payload.monthly,
    diagnosticsLatest: (payload.diagnosticsLatest || []).slice(-240),
    actionHistory: (payload.actionHistory || []).slice(0, 300),
    log: (payload.log || []).slice(0, 120),
    notifications: payload.notifications || [],
  };

function getSavedRunHistory() {
  try {
    const parsed = JSON.parse(localStorage.getItem(RUN_HISTORY_KEY) || '[]');
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function saveRunRecord(state) {
  if (!state?.gameOver) return null;
  const record = buildRunRecord(state);
  try {
    const history = getSavedRunHistory();
    const next = [record, ...history].slice(0, RUN_HISTORY_LIMIT);
    localStorage.setItem(RUN_HISTORY_KEY, JSON.stringify(next));
    window.__WYCWY_LAST_RUN_RECORD = record;
    return record;
  } catch (e) {
    console.warn('[WYCWY] run history save failed', e);
    return null;
  }
}

function hasRunStarted(state) {
  return !!state.hasStarted || state.day > 1 || state.hour !== 6 || state.totalCompleted > 0 || state.totalEarned > 0;
}

function SpeedControlGroup({ state, dispatch }) {
  const started = hasRunStarted(state);
  const firstStart = state.paused && !started;
  const speeds = started ? [1, 2, 4, 8] : [];
  const controlsClass = [
    'speed-controls',
    firstStart ? 'is-first-start is-cta' : '',
    state.paused && started ? 'is-paused' : '',
  ].filter(Boolean).join(' ');
  const playLabel = firstStart ? '开始运营' : (state.paused ? '继续运营' : '暂停');

  const runAtSpeed = (speed) => {
    SFX.click();
    dispatch({type: 'SET_SPEED', speed});
  };

  return (
    <div className={controlsClass}>
      <button
        className={`speed-btn play-toggle ${firstStart ? 'is-first-start is-cta' : ''}`}
        onClick={() => {
          SFX.click();
          dispatch(state.paused ? {type: 'SET_SPEED', speed: state.speed || 1} : {type: 'TOGGLE_PAUSE'});
        }}
        title={firstStart ? '以 1 倍速开始运营' : (state.paused ? `以 ${state.speed || 1} 倍速继续运营` : `暂停运营,当前 ${state.speed} 倍速`)}
        aria-label={firstStart ? '以 1 倍速开始运营' : (state.paused ? `以 ${state.speed || 1} 倍速继续运营` : `暂停运营,当前 ${state.speed} 倍速`)}
        aria-pressed={!state.paused}
      >
        {firstStart ? (
          <>
            <span className="run-btn-main">开始运营</span>
            <span className="run-btn-sub">1× 正常速度</span>
          </>
        ) : playLabel}
      </button>
      {speeds.map((speed) => (
        <button
          key={speed}
          className={`speed-btn ${state.speed === speed ? 'active' : ''}`}
          onClick={() => runAtSpeed(speed)}
          title={state.paused ? `${speed}倍速继续运营` : `${speed}倍速`}
          aria-label={state.paused ? `${speed}倍速继续运营` : `${speed}倍速`}
          aria-pressed={state.speed === speed}
        >
          {speed}×
        </button>
      ))}
    </div>
  );
}

function BottomHUD({ state, dispatch, onOpenLog, requestConfirm }) {
  const currentTier = state.unlockedEndingTier || 0;
  const tierEnding = ENDINGS.find((e) => e.tier === currentTier);

    <div className="bottom-hud">

function RunControlsFloating({ state, dispatch, requestConfirm }) {
  const currentTier = state.unlockedEndingTier || 0;

/* ============== V10.16: 车组卡 ============== */

function getDriverWorkState(driver, vehicle) {
  if (!vehicle) return '未配车';
  if (driver.status === 'driving') return '接单中';
  return '等待接单';
}

function getLoyaltyMeta(driver) {
  const loyalty = driver?.loyalty ?? 50;
  const quitLine = E.getDriverQuitLine ? E.getDriverQuitLine(driver) : 30;
  const normalCap = E.getDriverLoyaltyCap ? E.getDriverLoyaltyCap(driver) : 100;
  const effect = loyalty > normalCap
    ? '信任已突破职业上限,仍需保持公平对待'
    : `普通上限 ${normalCap},低于 ${quitLine} 可能离职`;
  if (loyalty < quitLine) {
    return {
      cls: 'danger',
      label: '离队风险',
      effect,
    };
  }
  if (loyalty < quitLine + 20) {
    return {
      cls: 'warn',
      label: '不稳定',
      effect,
    };
  }
  if (loyalty >= 80) {
    return {
      cls: 'good',
      label: '稳定',
      effect,
    };
  }
  return {
    cls: 'normal',
    label: '正常',
    effect,
  };
}

function getDriverStatLabel(stat) {
  return stat === 'driving' ? '车技' : E.statName(stat);
}

function getVehicleOrderName(order, compact = false) {
  const name = (order?.name || '').replace(/订单$/, '');
  return compact && name === '豪华车' ? '豪华' : name;
}

function getVehicleOrderNames(vd, compact = false) {
  return (vd.eligible || [])
    .map((id) => getVehicleOrderName(ORDERS.find((o) => o.id === id), compact))
    .filter(Boolean);
}

function getVehicleOrderSummary(vd) {
  // V14.54: 订单类型一行全展示,用短名和紧凑分隔避免高级车撑开卡片。
  const names = getVehicleOrderNames(vd, true);
  if (names.length === 0) return '暂无可接订单';
  return names.join('·');
}

function getVehicleOrderFullSummary(vd) {
  const names = getVehicleOrderNames(vd);
  return names.length > 0 ? names.join('、') : '暂无可接订单';
}

function CrewCompact({ driver, vehicle, selected, linked, onClick }) {
  const vd = vehicle ? E.getVehicleData(vehicle) : null;
  const status = getDriverWorkState(driver, vehicle);
  const lightClass = driver.status === 'driving' ? 'driving'
    : !vehicle ? 'empty' : 'idle';
  const showWorkStatus = lightClass === 'empty';
  const loyaltyMeta = getLoyaltyMeta(driver);
  // V14.27: 左侧车队只承载状态和累计值,收入动效统一放在地图里。
  return (
    <div className={`compact-card crew-card ${selected ? 'selected' : ''} ${linked ? 'linked' : ''}`} onClick={onClick}>
      <div className="crew-stack">
        <div className="crew-entity crew-person">
          <DriverAvatar avatar={driver.avatar} size={34} name={driver.name} />
          <div className="crew-entity-copy">
            <strong>{driver.name}</strong>
          </div>
        </div>
        <div className={`crew-entity crew-vehicle ${vd ? '' : 'empty'}`}>
          {vd ? <VehicleIcon template={vd} size={28} /> : <div className="crew-no-vehicle">无车</div>}
          <div className={`crew-entity-copy ${vd ? 'vehicle-order-copy' : ''}`}>
            {vd ? (
              <span className="crew-order-summary" title={getVehicleOrderFullSummary(vd)}>
                {getVehicleOrderSummary(vd)}
              </span>
            ) : (
              <>
                <strong>未配车</strong>
                <span>选择空车</span>
              </>
            )}
          </div>
        </div>
      </div>
      <div className="crew-side">
        {showWorkStatus && (
          <span className={`crew-status-pill ${lightClass}`} title={status}>
            <i className={`cc-status-light ${lightClass}`} />
            {status}
          </span>
        )}
        <span className={`crew-loyalty-mini ${loyaltyMeta.cls}`} title={`${loyaltyMeta.label} · ${loyaltyMeta.effect}`}>
          忠诚 {driver.loyalty ?? 50}
        </span>
        <span className="crew-earnings" title={`${driver.name} 累计跑单收入 ¥${driver.totalEarned || 0}`}>
          <span>已赚</span>
          <strong>¥{driver.totalEarned || 0}</strong>
        </span>
      </div>
    </div>
  );
}

function FleetPanel({
  state,
  selectedDriverId,
  selectedVehicleId,
  selectedVehicle,
  selectedDriver,
  onSelectDriver,
  onSelectVehicle,
  onClearSelection,
  onRecruit,
  onShop,
  onOpenRoadmap,
}) {
  // V14.6: 删除 crews/pending 两 tab 和顶部待处理横条,
  // 配车缺口直接由未配车司机/空车卡片自身表达。
  const drivers = state.drivers;
  const vehicles = state.vehicles;
  const emptyVehicles = vehicles.filter((v) => !drivers.some((d) => d.vehicleId === v.id));
  const operatingCrews = drivers.filter((d) => d.vehicleId && vehicles.some((v) => v.id === d.vehicleId)).length;
  const sortedDrivers = [...drivers].sort((a, b) => {
    const av = a.vehicleId ? 1 : 0;
    const bv = b.vehicleId ? 1 : 0;
    if (av !== bv) return bv - av;
    return a.id - b.id;
  });
  return (
    <div className="panel panel-tight fleet-panel">
      <MissionBar state={state} onOpenRoadmap={onOpenRoadmap} />
      <div className="panel-header fleet-panel-header">
        <span className="panel-title">车队</span>
        <div className="fleet-actions">
          <button className="btn btn-ghost btn-xs" onClick={onRecruit}>+ 招募</button>
          <button className="btn btn-ghost btn-xs" onClick={onShop}>+ 买车</button>
        </div>
        <div className="fleet-status-line">
          <span>{operatingCrews} 车组</span>
        </div>
      </div>
      <div className="compact-list fleet-list">
        {sortedDrivers.map((d) => {
          const vehicle = vehicles.find((v) => v.id === d.vehicleId);
          return (
            <CrewCompact
              key={`d-${d.id}`}
              driver={d}
              vehicle={vehicle}
              selected={selectedDriverId === d.id || (selectedVehicle ? d.vehicleId === selectedVehicle.id : false)}
              linked={selectedVehicle ? d.vehicleId === selectedVehicle.id : false}
              onClick={() => onSelectDriver(d.id)}
            />
          );
        })}
        {/* V14.2: 空车作为虚拟卡片排在列表最后,点击进入 CrewInspector 分配司机 */}
        {emptyVehicles.map((v) => {
          const tpl = E.getVehicleData(v);
          const isSelected = selectedVehicleId === v.id;
          return (
            <div key={`v-${v.id}`} className={`compact-card crew-card empty-vehicle-card ${isSelected ? 'selected' : ''}`}
                 onClick={() => onSelectVehicle(v.id)}>
              <div className="crew-stack">
                <div className="crew-entity crew-vehicle">
                  <VehicleIcon template={tpl} size={28} />
                  <div className="crew-entity-copy vehicle-order-copy">
                    <span className="crew-order-summary" title={getVehicleOrderFullSummary(tpl)}>
                      {getVehicleOrderSummary(tpl)}
                    </span>
                  </div>
                </div>
                <div className="crew-entity crew-person empty">
                  <div className="crew-empty-avatar">空</div>
                  <div className="crew-entity-copy">
                    <strong>待配司机</strong>
                    <span>点击分配</span>
                  </div>
                </div>
              </div>
              <div className="crew-side">
                <span className="crew-status-pill empty" title="空车">
                  <i className="cc-status-light empty" />
                  空车
                </span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============== V8: 常驻调度台 ============== */

function getOrderRequirementText(order) {
  const reqs = [];
  Object.entries(order.req || {}).forEach(([key, val]) => {
    reqs.push(`${E.statName(key)}≥${val}`);
  });
  return reqs.length > 0 ? reqs.join(' · ') : '无门槛';
}

function getInspectorVehicleOrderSummary(vd) {
  // V12: 车型只用钱解锁,不再展示"口碑 X 解锁"
  return `可接 ${getVehicleOrderSummary(vd)}`;
}

function getZoneOrderWeight(zone, orderId) {
  if (zone?.orderMix && zone.orderMix[orderId] !== undefined) return zone.orderMix[orderId];
  if (Array.isArray(zone?.hot)) return zone.hot.includes(orderId) ? 1 : 0;
  return 0;
}

function getZoneOrderRows(zone) {
  const total = ORDERS.reduce((sum, order) => sum + getZoneOrderWeight(zone, order.id), 0) || 1;
  // 固定为 ORDERS 的业务顺序:特惠 → 快车 → 专车 → 豪华车,方便横向比较片区。
  return ORDERS
    .map((order) => {
      const weight = getZoneOrderWeight(zone, order.id);
      const percent = Math.round(weight / total * 100);
      const minFare = Math.round(order.fare * 0.9);
      const maxFare = Math.round(order.fare * 1.2);
      const freq = percent >= 35 ? '高频' : percent >= 15 ? '常见' : '少量';
      return { order, weight, percent, freq, minFare, maxFare };
    })
    .filter((row) => row.weight > 0);
}

  if (!zone) return null;
  const unlocked = E.isZoneUnlocked(state, zone);
  const unlockText = E.getZoneUnlockText(state, zone);

  return (
    <div className="panel panel-tight inspector-panel order-inspector zone-inspector">
      <div className="panel-header">
        <span className="panel-title">片区信息</span>
        <button className="btn btn-ghost btn-xs" onClick={onClose}>关闭</button>

          <div className="inspector-title">{zone.name}</div>
          <div className="inspector-sub">
            {unlocked
              ? zone.desc
              : `${zone.desc} · ${unlockText}`}
          </div>
        </div>

        <div className="inspector-section">
          <div className="inspector-section-title">片区订单</div>
          <div className="zone-offer-list">
            {!unlocked && (
              <div className="inspector-card zone-state-card">
                <div className="order-req-line">片区暂未解锁</div>
                <div className="inspector-sub">{unlockText} 后会按下方结构进入接单池。</div>
              </div>
            )}
            {orderRows.map(({ order, percent, freq, minFare, maxFare }) => {
              return (
                <div key={`${zone.id}-${order.id}`} className="zone-offer-row">
                  <OrderIcon orderId={order.id} color="currentColor" size={12} />
                  <div>
                    <div className="zone-offer-title">{order.name}</div>

    </div>

}

function LogInspector({ state }) {
  const scrollRef = useRef(null);
  const followLatestRef = useRef(true);
  const logs = state.log || [];
  const chronologicalLogs = [...logs].reverse();
  const latestId = logs[0]?.id;

  const scrollToLatest = () => {
    const el = scrollRef.current;
    if (!el) return;
    el.scrollTop = el.scrollHeight;
    followLatestRef.current = true;
  };

  useEffect(() => {
    if (followLatestRef.current) requestAnimationFrame(scrollToLatest);
  }, [latestId]);

  const handleLogScroll = () => {
    const el = scrollRef.current;
    if (!el) return;
    followLatestRef.current = el.scrollHeight - el.scrollTop - el.clientHeight < 18;
  };

  return (
    <div className="panel panel-tight inspector-panel log-inspector">
      <div className="panel-header">
        <span className="panel-title">事件日志</span>
        <span className="panel-sub">时间正序 · 最新在底部</span>

// V11: 列出每个属性下一档能解锁哪个订单。从 ORDERS 动态推导,数值后台改 req 后 UI 自动同步。
function getNextOrderUnlock(stat, currentValue) {
  const thresholds = ORDERS
    .filter((o) => o.req && o.req[stat])
    .map((o) => ({ at: o.req[stat], name: o.name }))
    .sort((a, b) => a.at - b.at);
  return thresholds.find((th) => currentValue < th.at) || null;
}

function getStatOrderLinks(stat, currentValue, vehicleData) {
  return ORDERS
    .filter((o) => o.req && o.req[stat])
    .sort((a, b) => a.req[stat] - b.req[stat])
    .map((order) => {
      const need = order.req[stat];
      const missing = Math.max(0, need - currentValue);
      const vehicleReady = vehicleData ? vehicleData.eligible.includes(order.id) : false;
      let state = 'missing';
      let label = `差${missing}`;
      if (missing <= 0 && vehicleReady) {
        state = 'ready';
        label = '可跑';
      } else if (missing <= 0 && vehicleData && !vehicleReady) {
        state = 'vehicle';
        label = '需换车';
      } else if (missing <= 0 && !vehicleData) {
        state = 'vehicle';
        label = '需配车';
      }
      return { order, state, label };
    });
}

function getStatTrainHint(stat, currentValue, vehicleData, goodRate) {
  if (stat === 'service') {
    return '服务越高,好评率和口碑涨得越快';
  }
  // V14.67: 改为从 ORDERS.req 动态推导,避免数值后台改门槛后提示撒谎。
  const reqHints = ORDERS
    .filter((o) => o.req && typeof o.req[stat] === 'number')
    .map((o) => `${o.name}需${stat === 'driving' ? '车技' : '服务'}${o.req[stat]}`);
  return reqHints.length > 0 ? reqHints.join(',') : '提升此属性可解锁更高级订单';
}

function getTrainingCost(training, currentValue) {
  return E.getTrainingCost ? E.getTrainingCost(training, currentValue) : training.cost;
}

function DriverAttributeRows({ driver, statCaps, funds, dispatch, vehicleData, loyaltyMeta }) {
  // V14.65: 忠诚、车技、服务统一成同一种属性行;差异只体现在是否可主动训练。
  const goodRate = Math.round(E.getDriverGoodReviewRate(driver) * 100);
  const loyalty = Math.max(0, Math.min(100, driver.loyalty ?? 50));
  const loyaltyNormalCap = E.getDriverLoyaltyCap ? E.getDriverLoyaltyCap(driver) : 100;
  const loyaltyLimit = loyalty > loyaltyNormalCap ? 100 : loyaltyNormalCap;
  const rows = [
    {
      id: 'loyalty',
      type: 'loyalty',
      label: '忠诚',
      color: loyaltyMeta.cls === 'danger' || loyaltyMeta.cls === 'warn' ? 'var(--warn)' : 'var(--green)',
      value: loyalty,
      limit: loyaltyLimit,
      pct: Math.min(100, (loyalty / loyaltyLimit) * 100),
      meta: loyaltyMeta.label,
      hint: loyaltyMeta.effect,
      className: loyaltyMeta.cls,
    },
    ...TRAININGS.map((t) => {
      const cur = driver.stats[t.stat];
      const limit = statCaps[t.stat] || 99;
      const pct = Math.min(100, (cur / limit) * 100);
      const trainCost = getTrainingCost(t, cur);
      const enough = funds >= trainCost;
      const maxed = cur >= limit;
      return {
        id: t.id,
        type: 'training',
        training: t,
        label: getDriverStatLabel(t.stat),
        color: t.color,
        value: cur,
        limit,
        pct,
        enough,
        maxed,
        trainCost,
        meta: maxed ? '已满' : `¥${trainCost.toLocaleString()}/次`,
        hint: getStatTrainHint(t.stat, cur, vehicleData, goodRate),
        className: maxed ? 'maxed' : '',
      };
    }),
  ];
  return (
    <div className="driver-attr-list">
      {rows.map((row) => {
        const t = row.training;
        return (
          <div key={row.id} className={`driver-attr-row ${row.type} ${row.className || ''}`} style={{'--attr-color': row.color}}>
            <span className="driver-attr-label">{row.label}</span>
            <span className="driver-attr-value">{row.value}/{row.limit}</span>
            <span className={`driver-attr-meta ${row.enough === false && !row.maxed ? 'poor' : ''}`}>{row.meta}</span>
            <div className="driver-attr-meter" aria-label={`${row.label} ${row.value}/${row.limit}`}>
              <div className="driver-attr-fill" style={{transform: `scaleX(${row.pct / 100})`}} />
            </div>
            {t ? (
              <button
                className="driver-attr-action"
                disabled={!row.enough || row.maxed}
                title={row.maxed ? '已到上限' : `花 ¥${row.trainCost.toLocaleString()},${row.label} +${t.gainMin}~${t.gainMax}`}
                aria-label={row.maxed ? `${row.label}已到上限` : `花 ${row.trainCost.toLocaleString()} 提升${row.label}`}
                onClick={() => dispatch({type: 'TRAIN', driverId: driver.id, trainingId: t.id})}
              >
                {row.maxed ? '满' : '+'}
              </button>
            ) : (
              <span className="driver-attr-action-placeholder" aria-hidden="true" />
            )}
            {row.hint && <div className="driver-attr-hint">{row.hint}</div>}
          </div>
        );
      })}
    </div>
  );
}

    return () => window.removeEventListener('resize', measure);

  const handleNext = () => {
    SFX.click && SFX.click();
    if (step >= STEPS.length - 1) onClose();
    else setStep(step + 1);
  };
  const handleSkip = () => { SFX.click && SFX.click(); onClose(); };

  return (
    <div className="coach-root">
      {(measuredSpot || cur.spot)
        ? <div className="coach-spot" style={measuredSpot || cur.spot} />
        : <div className="coach-mask-full" />}
      <div className="coach-bubble" style={cur.bubble}>
        <div className="coach-step-num">{cur.tag}</div>
        <div className="coach-title">{cur.title}</div>
        <div className="coach-text">{cur.text}</div>
        <div className="coach-actions">
          <div className="coach-progress" aria-label={`引导进度 ${step + 1}/${STEPS.length}`}>
            {STEPS.map((_, idx) => (
              <span key={idx} className={idx <= step ? 'active' : ''} />
            ))}
          </div>
          <button className="coach-skip" onClick={handleSkip}>跳过</button>
          <button className="coach-next" onClick={handleNext}>
            {cur.isLast ? '知道了' : '下一步'}
          </button>
        </div>
      </div>
    </div>
  );
}

function previewEventEffect(option, state) {
  try {
    const raw = option.apply(state) || {};
    return E.scaleEventEffect ? E.scaleEventEffect(raw, state) : raw;
  } catch (e) {
    return { previewError: true };
  }
}

function getBestDriverForEvent(state) {
  if (!state || !state.drivers || state.drivers.length === 0) return null;
  const total = (driver) => Object.values(driver.stats || {}).reduce((sum, val) => sum + val, 0);
  return [...state.drivers].sort((a, b) => total(b) - total(a))[0];
}

function getEventOptionDetail(option, effect) {
  if (!option || !option.detail) return '';
  if (effect.eventScale || effect.orderBoost) return '';
  return option.detail;
}

function detailLooksLikeNumericEffect(detail) {
  return /[¥+\-−]|忠诚|信任|口碑|抽成|事故|订单|失去|留队|合规/.test(detail || '');
}

function formatOrderBoostText(effect) {
  if (!effect.orderBoost || effect.orderBoost === 1) return '';
  const percent = Math.round(Math.abs(effect.orderBoost - 1) * 100);
  const duration = effect.boostDuration ? `,持续 ${effect.boostDuration} 天` : ',持续今天';
  return effect.orderBoost > 1
    ? `接单收入临时提高 ${percent}%${duration}`
    : `接单收入临时降低 ${percent}%${duration}`;
}

// V14: 投资人压力多选弹窗 — 三个开关任意组合 + 兜底「靠流水硬扛」单选
function EventResourceSnapshot({ state, thirdLabel = '今日流水', thirdValue, thirdTone = '' }) {
  if (!state) return null;
  const metrics = [
    { label: '资金', value: `¥${state.funds.toLocaleString()}`, tone: state.funds < 0 ? 'danger' : '' },
    { label: '口碑', value: state.reputation },
    { label: thirdLabel, value: thirdValue ?? `¥${state.todayEarned.toLocaleString()}`, tone: thirdTone },
    { label: '司机/车辆', value: `${state.drivers.length}/${state.vehicles.length}` },
  ];
  return (
    <div className="event-resource-snapshot" aria-label="当前经营状态">
      {metrics.map((metric) => (
        <div key={metric.label}>
          <span>{metric.label}</span>
          <strong className={metric.tone}>{metric.value}</strong>
        </div>
      ))}
    </div>
  );
}

function compactNames(items, getName, limit = 3) {
  const names = (items || []).map(getName).filter(Boolean);
  if (!names.length) return '';
  const shown = names.slice(0, limit).join('、');
  return names.length > limit ? `${shown} 等 ${names.length} 个` : shown;
}

function InvestorPressureModal({ event, state, onResolve }) {
  const [fire, setFire] = useState(false);
  const [sell, setSell] = useState(false);
  const [debt, setDebt] = useState(false);
  const anyPicked = fire || sell || debt;
  const plan = E.getInvestorPressurePlan ? E.getInvestorPressurePlan(state) : null;
  const fireDisabled = !plan || !plan.fireDrivers.length;
  const sellDisabled = !plan || !plan.sellVehicles.length;
  const fireNames = compactNames(plan?.fireDrivers, (d) => d.name);
  const vehicleNames = compactNames(plan?.sellVehicles, (v) => E.getVehicleData(v)?.name || v.name);
  const debtInterestPct = Math.round((plan?.debtInterestRate || 0) * 100);
  // V14.9 修复:之前没考虑 bankruptcyGraceBonus,导致玩家裁过员后再触发投资人事件时
  // 倒计时显示数字会少 +graceBonus 天(实际死亡判定用的是 DEATH_FUNDS_DAYS+graceBonus)
  const daysLeft = Math.max(0, GAME.DEATH_FUNDS_DAYS + (state.bankruptcyGraceBonus || 0) - (state.negFundsDays || 0));
  return (
    <div className="modal-overlay">
      <div className="modal event-modal">
        <div className="event-modal-header">
          <div className="modal-tag">{event.tag}事件</div>
          <div className="modal-title">{event.title}</div>
          <div className="modal-desc">{event.desc}</div>
        </div>
        <EventResourceSnapshot state={state} thirdLabel="距破产" thirdValue={`${daysLeft} 天`} thirdTone="danger" />
        <div className="investor-choices">
          <label className={`investor-choice ${fireDisabled ? 'disabled' : ''}`}>
            <input type="checkbox" checked={fire} disabled={fireDisabled}
              onChange={(e) => setFire(e.target.checked)} />
            <div className="investor-choice-body">
              <div className="investor-choice-label">
                {fireDisabled ? '裁员止血 — 只剩 1 名司机,不可裁' : `裁撤 ${plan.fireDrivers.length} 名高薪司机`}
              </div>
              {!fireDisabled && (
                <div className="investor-choice-detail">
                  {fireNames} · 月省 ¥{plan.monthlySavings.toLocaleString()} · 破产宽容 +{plan.fireGraceDays} 天
                </div>
              )}
            </div>
          </label>
          <label className={`investor-choice ${sellDisabled ? 'disabled' : ''}`}>
            <input type="checkbox" checked={sell} disabled={sellDisabled}
              onChange={(e) => setSell(e.target.checked)} />
            <div className="investor-choice-body">
              <div className="investor-choice-label">
                {sellDisabled ? '卖车回血 — 只剩 1 辆车,不可卖' : `卖出 ${plan.sellVehicles.length} 辆高价车辆`}
              </div>
              {!sellDisabled && (
                <div className="investor-choice-detail">
                  {vehicleNames} · 立刻 +¥{plan.sellRefund.toLocaleString()}(60% 残值)
                </div>
              )}
            </div>
          </label>
          <label className="investor-choice">
            <input type="checkbox" checked={debt}
              onChange={(e) => setDebt(e.target.checked)} />
            <div className="investor-choice-body">
              <div className="investor-choice-label">借高利贷 ¥{(plan?.debtPrincipal || 10000).toLocaleString()}</div>
              <div className="investor-choice-detail">
                覆盖当前缺口 ¥{(plan?.deficit || 0).toLocaleString()} · {plan?.debtPeriodDays || 30} 天后还 ¥{(plan?.debtRepay || 12000).toLocaleString()} · 利息约 {debtInterestPct || 20}%
              </div>
            </div>
          </label>
        </div>
        <div className="investor-actions">
          <button className="btn btn-primary"
            disabled={!anyPicked}
            onClick={() => onResolve({ fire, sell, debt })}>
            提交方案{anyPicked ? '' : ' (至少选 1 项)'}
          </button>
          <div className="investor-divider">或</div>
          <button className="btn btn-ghost"
            disabled={anyPicked}
            onClick={() => onResolve({ holdOn: true })}>
            不采取措施,靠流水回正
          </button>
          <div className="investor-hold-note">
            适合你判断接下来订单流水足够强、现金很快能转正的情况。若 <strong>{daysLeft} 天内资金没有回正</strong>,投资人撤资,游戏结束。
          </div>
        </div>
      </div>
    </div>
  );
}

function EventModal({ event, state, onResolve, onResolveInvestor }) {
  if (event.multiChoice) {
    return <InvestorPressureModal event={event} state={state} onResolve={onResolveInvestor} />;
  }
  return (
    <div className="modal-overlay">
      <div className="modal event-modal">
        <div className="event-modal-header">
          <div className="modal-tag">{event.tag}事件</div>
          <div className="modal-title">{event.title}</div>
          <div className="modal-desc">{event.desc}</div>
        </div>
        <EventResourceSnapshot state={state} />
        <div className="modal-options">
          {event.options.map((o, i) => {
            const eff = previewEventEffect(o, state);
            const hasImmediateEffect = Object.keys(eff).some((key) => key !== 'eventScale' && key !== 'previewError');
            const nextFunds = eff.funds !== undefined && state ? state.funds + eff.funds : null;
            const bestDriver = getBestDriverForEvent(state);
            const salaryAfter = bestDriver && eff.salaryRaise ? bestDriver.salary + eff.salaryRaise : null;
            const salaryDaily = eff.salaryRaise ? Math.round(eff.salaryRaise / 30) : 0;
            const optionDetail = getEventOptionDetail(o, eff);
            const showNoImmediateEffect = !hasImmediateEffect && !detailLooksLikeNumericEffect(optionDetail);
            const orderBoostText = formatOrderBoostText(eff);
            return (
              <button key={i} className="modal-option" onClick={() => onResolve(i)}>
                <div className="modal-option-label">{o.label}</div>
                {optionDetail && <div className="modal-option-effect">{optionDetail}</div>}
                <div className="event-effect-preview">
                  {eff.funds !== undefined && (
                    <span className={eff.funds < 0 ? 'negative' : 'positive'}>
                      资金 {eff.funds > 0 ? '+' : ''}{eff.funds.toLocaleString()} · 选后 ¥{nextFunds.toLocaleString()}
                    </span>
                  )}
                  {eff.reputation !== undefined && (
                    <span className={eff.reputation < 0 ? 'negative' : 'positive'}>
                      口碑 {eff.reputation > 0 ? '+' : ''}{eff.reputation}
                    </span>
                  )}
                  {eff.allLoyalty !== undefined && (
                    <span className={eff.allLoyalty < 0 ? 'negative' : 'positive'}>
                      全员忠诚 {eff.allLoyalty > 0 ? '+' : ''}{eff.allLoyalty}
                    </span>
                  )}
                  {eff.trustLoyalty !== undefined && (
                    <span className={eff.trustLoyalty < 0 ? 'negative' : 'positive'}>
                      全员信任 {eff.trustLoyalty > 0 ? '+' : ''}{eff.trustLoyalty}
                    </span>
                  )}
                  {eff.salaryRaise && eff.keepBest && bestDriver && (
                    <>
                      <span className="negative">
                        {bestDriver.name} 月薪 +¥{eff.salaryRaise} → ¥{salaryAfter}
                      </span>
                      <span className="negative">日成本约 +¥{salaryDaily}</span>
                      <span className="positive">{bestDriver.name} 留队 · 忠诚 +30</span>
                    </>
                  )}
                  {orderBoostText && (
                    <span className={eff.orderBoost < 1 ? 'negative' : 'positive'}>
                      {orderBoostText}
                    </span>
                  )}
                  {eff.commissionRate !== undefined && (
                    <span>平台抽成调整为 {Math.round(eff.commissionRate * 100)}%</span>
                  )}
                  {eff.certifyFleet && <span className="positive">当前车辆合规升级</span>}
                  {eff.accidentRisk && (
                    <span className="negative">
                      {Math.round(eff.accidentRisk.chance * 100)}% 事故风险
                      {eff.accidentRisk.funds ? ` · 修车 ${eff.accidentRisk.funds.toLocaleString()}` : ''}
                      {eff.accidentRisk.allLoyalty ? ` · 全员忠诚 ${eff.accidentRisk.allLoyalty}` : ''}
                      {eff.accidentRisk.trustLoyalty ? ` · 全员信任 ${eff.accidentRisk.trustLoyalty}` : ''}
                      {eff.accidentRisk.reputation ? ` · 口碑 ${eff.accidentRisk.reputation}` : ''}
                    </span>
                  )}
                  {eff.loseBest && <span className="negative">失去最强司机{bestDriver ? ` ${bestDriver.name}` : ''}</span>}
                  {eff.previewError && <span className="negative">事件预览异常,请选择其他方案</span>}
                  {showNoImmediateEffect && <span>无立即数值变化</span>}
                </div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// V14.29: 订单目标 — 用 zone.orderMix 推导可刷出该订单的片区集合,挑门槛最低的;
//      车组判断要"同一司机配能接此订单的车"(canTakeOrder 等价),避免分别匹配出错。
function computeOrderUnlockStatus(order, state) {
  const reqStat = order.req || {};
  const reqStatKeys = Object.keys(reqStat);

  // 1. 片区:从 zone.orderMix 找出能刷该订单的所有片区,挑门槛最低
  const candidateZones = ZONES.filter((z) => getZoneOrderWeight(z, order.id) > 0);
  const sortedByThreshold = candidateZones.slice().sort((a, b) => {
    const aT = (a.unlock && a.unlock.reputation) || 0;
    const bT = (b.unlock && b.unlock.reputation) || 0;
    return aT - bT;
  });
  const easiestZone = sortedByThreshold[0];
  const unlockedZone = sortedByThreshold.find((z) => E.isZoneUnlocked(state, z));
  const zoneStatus = unlockedZone
    ? { ok: true, label: `片区 · ${unlockedZone.name} 已解锁`, missing: null }
    : easiestZone
      ? {
          ok: false,
          label: `片区 · ${easiestZone.name}`,
          missing: `口碑 ≥ ${(easiestZone.unlock && easiestZone.unlock.reputation) || 0}(当前 ${state.reputation})`,
        }
      : { ok: false, label: '片区', missing: '该订单暂无片区可刷出' };

  // 2. 车组配对:必须存在"司机+车"组合同时满足属性门槛 + 车型 eligible
  const validCrew = state.drivers.find((d) => {
    if (!d.vehicleId) return false;
    if (!reqStatKeys.every((k) => (d.stats[k] || 0) >= (reqStat[k] || 0))) return false;
    const v = state.vehicles.find((x) => x.id === d.vehicleId);
    if (!v) return false;
    const vd = E.getVehicleData(v);
    return vd && vd.eligible.includes(order.id);
  });

  const driverMatch = state.drivers.find((d) =>
    reqStatKeys.every((k) => (d.stats[k] || 0) >= (reqStat[k] || 0))
  );
  const vehicleMatch = state.vehicles.find((v) => {
    const vd = E.getVehicleData(v);
    return vd && vd.eligible.includes(order.id);
  });
  const eligibleVehicleNames = VEHICLES.filter((v) => v.eligible.includes(order.id)).map((v) => v.name);

  const statStatus = reqStatKeys.length === 0
    ? { ok: true, label: '司机属性 · 无门槛', missing: null }
    : driverMatch
      ? { ok: true, label: `司机属性 · ${driverMatch.name} 已达标`, missing: null }
      : {
          ok: false,
          label: '司机属性',
          missing: reqStatKeys.map((k) => `${E.statName(k)} ≥ ${reqStat[k]}`).join(' + '),
        };

  const vehicleStatus = vehicleMatch
    ? { ok: true, label: `车型 · ${E.getVehicleData(vehicleMatch).name} 可接`, missing: null }
    : {
        ok: false,
        label: '车型',
        missing: `需要 ${eligibleVehicleNames.join(' / ')}`,
        actionable: 'shop',
      };

  // 司机和车都达标但不在同一车组 → 加一条"配对"提示(避免误标已解锁)
  if (!validCrew && driverMatch && vehicleMatch) {
    return {
      order,
      zone: zoneStatus,
      stat: { ok: false, label: '车组配对', missing: `把 ${driverMatch.name} 配到 ${E.getVehicleData(vehicleMatch).name}(司机和能接此单的车要在同一车组)` },
      vehicle: vehicleStatus,
      unlocked: false,
    };
  }

  return {
    order,
    zone: zoneStatus,
    stat: statStatus,
    vehicle: vehicleStatus,
    unlocked: zoneStatus.ok && !!validCrew && statStatus.ok && vehicleStatus.ok,
  };
}

function getNextRoadmapTarget(allStatus) {
  const locked = allStatus.filter((s) => !s.unlocked);
  if (locked.length === 0) return null;
  return locked.slice().sort((a, b) => {
    const am = (a.zone.ok ? 0 : 1) + (a.stat.ok ? 0 : 1) + (a.vehicle.ok ? 0 : 1);
    const bm = (b.zone.ok ? 0 : 1) + (b.stat.ok ? 0 : 1) + (b.vehicle.ok ? 0 : 1);
    if (am !== bm) return am - bm;
    return a.order.fare - b.order.fare;
  })[0];
}

function getEndingRoadmapStatus(ending, state) {
  const currentTier = state.unlockedEndingTier || 0;
  if (ending.tier <= currentTier) return { cls: 'done', label: '已达成' };
  if (ending.tier === currentTier + 1) return { cls: 'next', label: ending.forceEnd ? '最终目标' : '下一阶段' };
  if (ending.forceEnd) return { cls: 'final', label: '终局' };
  return { cls: 'locked', label: '未达成' };
}

function getTargetEndingRows(state) {
  const currentTier = state.unlockedEndingTier || 0;
  const revealTier = Math.min(ENDINGS.length, currentTier + 1);
  return ENDINGS.map((ending) => {
    const hidden = ending.tier > revealTier;
    const status = hidden ? { cls: 'hidden', label: '未揭晓' } : getEndingRoadmapStatus(ending, state);
    return { ending, hidden, status };
  });
}

// V14.90: 跨局成就聚合 — 历史里达到过该 tier 即视为已征服
function getEndingAchievements(state) {
  const history = getSavedRunHistory();
  const currentTier = state.unlockedEndingTier || 0;
  return ENDINGS.map((ending) => {
    const conqueredInHistory = history.some((h) => (h?.summary?.unlockedEndingTier || 0) >= ending.tier);
    const meetsNow = (() => {
      try { return ending.check(state); } catch (e) { return false; }
    })();
    // 已征服过的结局直接揭晓真名(成就感),否则按当前进度的 +1 揭晓规则
    const revealed = conqueredInHistory || ending.tier <= currentTier + 1;
    let badge;
    if (conqueredInHistory) badge = { cls: 'conquered', icon: '✓', label: '已征服' };
    else if (meetsNow) badge = { cls: 'reachable', icon: '✦', label: '可冲击' };
    else if (ending.tier <= currentTier) badge = { cls: 'progressing', icon: '→', label: '进行中' };
    else if (revealed) badge = { cls: 'pending', icon: '—', label: '未触及' };
    else badge = { cls: 'hidden', icon: '?', label: '未揭晓' };
    return { ending, badge, revealed };
  });
}

function formatRunHistoryDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return `${m}/${day} ${hh}:${mm}`;
  } catch (e) { return ''; }
}

          <div className="ending-title">{headline}</div>
          {isWin && ending.endingName && (
            <div style={{color: 'var(--ink-3)', fontSize: 14, marginBottom: 10}}>{titleMap[ending.type]}</div>
          )}
          <div style={{color: 'var(--ink-2)', marginBottom: 8, lineHeight: 1.6}}>{story}</div>
          <div className="ending-stats">
            <div className="ending-stat"><div className="ending-stat-label">营运天数</div><div className="ending-stat-value">{ending.stats.days}</div></div>
            <div className="ending-stat"><div className="ending-stat-label">总流水</div><div className="ending-stat-value">¥{ending.stats.totalEarned.toLocaleString()}</div></div>
            <div className="ending-stat"><div className="ending-stat-label">完成订单</div><div className="ending-stat-value">{ending.stats.totalCompleted}</div></div>
            <div className="ending-stat"><div className="ending-stat-label">城市口碑</div><div className="ending-stat-value">{ending.stats.reputation}</div></div>
            <div className="ending-stat"><div className="ending-stat-label">可运营车组</div><div className="ending-stat-value">{ending.stats.crews ?? Math.min(ending.stats.drivers, ending.stats.vehicles)}</div></div>
          </div>
          <button className="btn btn-primary btn-block" onClick={onReset} style={{padding: 12}}>再来一遍</button>
        </div>
      </div>
    </div>
  );
}

// V6: 达成新结局时弹窗 — 提供"领奖结束/继续冲击"
function EndingUnlockModal({ ending, onClaim, onContinue }) {
  return (
    <div className="modal-overlay" style={{zIndex: 110}}>
      <div className="modal" style={{maxWidth: 480, textAlign: 'center', borderColor: 'var(--gold)', borderWidth: 3, borderStyle: 'solid'}}>
        <div className="modal-tag" style={{background: 'var(--gold)', color: 'var(--ink)'}}>
          已解锁结局 · 阶段 {ending.tier}
        </div>
        <div className="modal-title" style={{fontSize: 24, marginTop: 8}}>{ending.name}</div>
        <div className="modal-desc" style={{margin: '14px 0', lineHeight: 1.7}}>{ending.desc}</div>
        <div className="ending-detail-line">{ending.detail}</div>
        <div className="modal-options" style={{marginTop: 20}}>
          <button className="btn btn-primary btn-block" style={{padding: 12, background: 'var(--gold)', color: 'var(--ink)'}} onClick={onClaim}>
            领奖结束(以《{ending.name}》收尾)
          </button>
          <button className="btn btn-ghost btn-block" style={{padding: 10}} onClick={onContinue}>
            继续运营 · 冲击更高结局
          </button>
        </div>
      </div>
    </div>
  );
}

function MissionToast({ mission, onClose }) {
  useEffect(() => {
    const t = setTimeout(onClose, mission.reward?.isFinale ? 10000 : 8000);
    return () => clearTimeout(t);
  }, [mission]);
  const rewardAmount = mission.reward?.funds || 0;
  if (mission.reward?.isFinale) {
    return (
      <div className="modal-overlay game-feedback-overlay" onClick={onClose}>
        <GameFeedbackCard
          tone="gold"
          tag="通关达成"
          title={mission.title}
          message={mission.reward?.message}
          reward={mission.reward?.funds > 0 ? `奖励 +¥${mission.reward.funds}` : ''}
          iconLabel="通关"
          asset="achievement"
          actionLabel="继续运营"
          onClose={onClose}
          modal
        />
      </div>
    );
  }
  return (
    <GameFeedbackCard
      tone="accent"
      tag="任务完成"
      title={mission.title}
      message={mission.reward?.message}
      reward={rewardAmount > 0 ? { label: '奖励', value: `+¥${rewardAmount}` } : ''}
      iconLabel="任务"
      asset="mission"
      actionLabel="领取奖励"
      onClose={onClose}
      className="mission-feedback"
    />
  );
}

/* ============== ConfirmModal:替代 native confirm(),保持开罗工坊视觉一致 ============== */

function ConfirmModal({ title, message, confirmLabel = '确定', cancelLabel = '取消', danger = false, tag, onConfirm, onClose }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 420 }}>
        <span className="modal-tag">
          {tag || (danger ? '风险确认' : '操作确认')}
        </span>
        <h2 className="modal-title">{title}</h2>
        {message && (
          <p className="modal-desc" style={{ whiteSpace: 'pre-line' }}>{message}</p>
        )}
        <div style={{ display: 'flex', flexDirection: 'row', gap: 8, marginTop: 4 }}>
          <button className="btn btn-ghost" onClick={onClose} style={{ flex: 1 }}>
            {cancelLabel}
          </button>
          <button
            className={`btn ${danger ? 'ds-confirm-danger' : 'btn-primary'}`}
            onClick={() => { onConfirm(); onClose(); }}
            style={{ flex: 1 }}
          >
            {confirmLabel}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============== App 主组件 ============== */

function App() {
  const [state, dispatch] = useReducer(E.gameReducer, null, E.makeInitialState);
  const savedGameOverKeyRef = useRef(null);
  // V12.2: 暴露给测试脚本(Playwright)用,生产可见但只读取/写入,无 UI 影响
  // V14.89: 加 requestConfirm 暴露,方便 ConfirmModal 视觉验证
  window.__WYCWY_TEST = { dispatch, state, exportGameDiagnostics, getSavedRunHistory, saveRunRecord, get requestConfirm() { return requestConfirm; } };
  const [selectedDriverId, setSelectedDriverId] = useState(null);
  const [selectedVehicleId, setSelectedVehicleId] = useState(null);
  const [selectedZoneId, setSelectedZoneId] = useState(null);
  const [mobileTab, setMobileTab] = useState('city');
  const [showRecruit, setShowRecruit] = useState(false);
  const [showShop, setShowShop] = useState(false);
  const [inspectorTab, setInspectorTab] = useState('details');
  const [showRoadmap, setShowRoadmap] = useState(false);
  const [muted, setMutedState] = useState(isMuted());
  const [configUpdated, setConfigUpdated] = useState(false);
  // V14.89: ConfirmModal 替代 native confirm()
  const [confirmOpts, setConfirmOpts] = useState(null);
  const requestConfirm = (opts) => setConfirmOpts(opts);

  // V5: 监听 admin 后台的配置变化(跨 tab 通讯)
  useEffect(() => {
    if (typeof BroadcastChannel === 'undefined') return undefined;
    const ch = new BroadcastChannel('wycwy-config');
    ch.onmessage = (ev) => {
      if (ev.data?.type === 'config-update') setConfigUpdated(true);
    };
    return () => ch.close();
  }, []);
  const [crtOn, setCrtOn] = useState(() => {
    if (localStorage.getItem('wycwy-visual-version') !== 'v10.3') {
      localStorage.setItem('wycwy-visual-version', 'v10.3');
      localStorage.setItem('wycwy-crt', '0');
      return false;
    }
    return localStorage.getItem('wycwy-crt') === '1';
  });
  // 上一次的关键状态 — 用于差分触发 sfx
  const prevRef = useRef({
    completedTotal: 0,
    trainings: 0,
    vehicles: state.vehicles.length,
    drivers: state.drivers.length,
  });

  useEffect(() => {
    if (!state.gameOver) return;
    const key = [
      state.gameOver.type,
      state.gameOver.deathCause || state.gameOver.endingId || state.gameOver.endingName || 'unknown',
      state.day,
      state.hour,
      state.funds,
      state.totalCompleted,
    ].join('|');
    if (savedGameOverKeyRef.current === key) return;
    savedGameOverKeyRef.current = key;
    saveRunRecord(state);
  }, [state.gameOver, state.day, state.hour, state.funds, state.totalCompleted]);

  useEffect(() => {
    if (state.paused || state.activeEvent || state.activeStory || state.showTutorial || state.gameOver) return;
    const interval = setInterval(() => dispatch({type: 'TICK'}), GAME.TICK_MS / state.speed);
    return () => clearInterval(interval);
  }, [state.paused, state.speed, state.activeEvent, state.activeStory, state.showTutorial, state.gameOver]);

  useEffect(() => {
    if (!selectedZoneId) return;
    if (!ZONES.some((z) => z.id === selectedZoneId)) setSelectedZoneId(null);
  }, [selectedZoneId]);

  // V14.67: 用 ref 跟踪已经 schedule 过清理的 id,避免 length 不变时漏清理或重复 schedule。
  const scheduledFloatGainsRef = useRef(new Set());
  useEffect(() => {
    state.floatGains.forEach((g) => {
      if (scheduledFloatGainsRef.current.has(g.id)) return;
      scheduledFloatGainsRef.current.add(g.id);
      setTimeout(() => {
        scheduledFloatGainsRef.current.delete(g.id);
        dispatch({type: 'CLEAR_FLOAT_GAIN', id: g.id});
      }, 1700);
    });
  }, [state.floatGains]);

  const scheduledNotifsRef = useRef(new Set());
  useEffect(() => {
    state.notifications.forEach((n) => {
      if (scheduledNotifsRef.current.has(n.id)) return;
      scheduledNotifsRef.current.add(n.id);
      setTimeout(() => {
        scheduledNotifsRef.current.delete(n.id);
        dispatch({type: 'CLEAR_NOTIF', id: n.id});
      }, 3000);
    });
  }, [state.notifications]);

  // CRT toggle
  useEffect(() => {
    document.body.classList.toggle('crt-on', crtOn);
    localStorage.setItem('wycwy-crt', crtOn ? '1' : '0');
  }, [crtOn]);

  // 音效触发(差分检测)
  useEffect(() => {
    const p = prevRef.current;
    if (state.totalCompleted > p.completedTotal) SFX.complete();
    if ((state.totalTrainings || 0) > p.trainings) SFX.train();
    if (state.vehicles.length > p.vehicles || state.drivers.length > p.drivers) SFX.buy();
    prevRef.current = {
      completedTotal: state.totalCompleted,
      trainings: state.totalTrainings || 0,
      vehicles: state.vehicles.length,
      drivers: state.drivers.length,
    };
  }, [state.totalCompleted, state.totalTrainings, state.vehicles.length, state.drivers.length]);

  // 任务完成 → 非阻塞提示。V14.28 起取消全屏闪光,避免任务卡出现时整屏白闪。
  useEffect(() => {
    if (state.newMissionComplete) {
      SFX.mission();
    }
  }, [state.newMissionComplete]);

  // 通知警告音 — V14.67: 仅在出现新的 warn 通知时触发,避免清理通知导致 length 变化时误响。
  const lastWarnIdRef = useRef(null);
  useEffect(() => {
    const lastWarn = [...state.notifications].reverse().find((n) => n.level === 'warn');
    if (lastWarn && lastWarn.id !== lastWarnIdRef.current) {
      lastWarnIdRef.current = lastWarn.id;
      SFX.warn();
    }
  }, [state.notifications]);

  // 滚动数字
  const fundsDisplay = useCountUp(state.funds, 350);
  const repDisplay = useCountUp(state.reputation, 300);

  const selectedDriver = state.drivers.find((d) => d.id === selectedDriverId);
  const selectedVehicle = state.vehicles.find((v) => v.id === selectedVehicleId);
  const selectedVehicleDriver = selectedVehicle ? state.drivers.find((d) => d.vehicleId === selectedVehicle.id) : null;
  const selectedCrewDriver = selectedDriver || selectedVehicleDriver;
  const selectedCrewVehicle = selectedDriver
    ? state.vehicles.find((v) => v.id === selectedDriver.vehicleId)
    : selectedVehicle;
  const selectedZone = ZONES.find((z) => z.id === selectedZoneId);
  // V14.9: dispatchOffers 已删除,不再 derive selectedZoneOffers
  const hasFinaleMissionNotice = !!state.newMissionComplete?.reward?.isFinale;
  const showFeedbackStack = !!state.newMissionComplete && !hasFinaleMissionNotice;

  // V14.34: 右侧调度台默认落到可操作车组,避免长期显示"从左侧选择车组"空状态。
  useEffect(() => {
    if (selectedZoneId || inspectorTab === 'log') return;
    const driverStillExists = selectedDriverId && state.drivers.some((d) => d.id === selectedDriverId);
    const vehicleStillExists = selectedVehicleId && state.vehicles.some((v) => v.id === selectedVehicleId);
    if (driverStillExists || vehicleStillExists) return;

    const fallbackDriver = state.drivers.find((d) =>
      d.vehicleId && state.vehicles.some((v) => v.id === d.vehicleId)
    ) || state.drivers[0];
    if (fallbackDriver) {
      setSelectedVehicleId(null);
      setSelectedDriverId(fallbackDriver.id);
      return;
    }

    const fallbackVehicle = state.vehicles[0];
    if (fallbackVehicle) {
      setSelectedDriverId(null);
      setSelectedVehicleId(fallbackVehicle.id);
    }
  }, [selectedZoneId, inspectorTab, selectedDriverId, selectedVehicleId, state.drivers, state.vehicles]);

  const toggleMute = () => {
    const v = !muted;
    setMutedState(v);
    setMuted(v);
    if (!v) SFX.click();
  };
  const toggleCrt = () => {
    setCrtOn((v) => !v);
    SFX.click();
  };
  const selectZone = (zoneId) => {
    setSelectedZoneId(zoneId);
    setSelectedDriverId(null);
    setSelectedVehicleId(null);
    setInspectorTab('details');
    setMobileTab('inspector');
  };

  return (
    <>
      <TopBar
        state={state}
        fundsDisplay={fundsDisplay}
        repDisplay={repDisplay}
        muted={muted} onToggleMute={toggleMute}
        crtOn={crtOn} onToggleCrt={toggleCrt}
        onShowTutorial={() => dispatch({type: 'OPEN_TUTORIAL'})}
      />
      <div className={`main-v3 mobile-${mobileTab}`}>
        <div className="col fleet-col">
          <FleetPanel
            state={state}
            selectedDriverId={selectedDriverId}
            selectedVehicleId={selectedVehicleId}
            selectedVehicle={selectedVehicle}
            selectedDriver={selectedDriver}
            onSelectDriver={(driverId) => { setSelectedZoneId(null); setSelectedVehicleId(null); setSelectedDriverId(driverId); setInspectorTab('details'); setMobileTab('inspector'); }}
            onSelectVehicle={(vehicleId) => { setSelectedZoneId(null); setSelectedDriverId(null); setSelectedVehicleId(vehicleId); setInspectorTab('details'); setMobileTab('inspector'); }}
            onClearSelection={() => { setSelectedZoneId(null); setSelectedDriverId(null); setSelectedVehicleId(null); }}
            onRecruit={() => setShowRecruit(true)}
            onShop={() => setShowShop(true)}
            onOpenRoadmap={() => setShowRoadmap(true)}
          />
        </div>

        <div className="col ops-col">
          <div className="panel city-panel">
            <div className="panel-header">
              <span className="panel-title">城市订单地图</span>
              <span className="panel-sub">片区自动匹配 · 小车显示订单去向</span>
            </div>
            <div className="city-wrap">
              <CityMap
                zones={ZONES}
                drivers={state.drivers}
                hour={state.hour}
                state={state}
                selectedZoneId={selectedZoneId}
                onSelectZone={selectZone}
              />
              <RunControlsFloating state={state} dispatch={dispatch} requestConfirm={requestConfirm} />
            </div>
          </div>
        </div>

        <div className="col inspector-col">
          <div className="inspector-tab-shell">
            <InspectorTabs active={inspectorTab} onChange={setInspectorTab} />
            {inspectorTab === 'log' ? (
              <LogInspector state={state} />
            ) : selectedZone ? (
              <ZoneInspector
                zone={selectedZone}
                state={state}
                onClose={() => setSelectedZoneId(null)}
              />
            ) : (selectedCrewDriver || selectedCrewVehicle) ? (
              <CrewInspector
                driver={selectedCrewDriver}
                vehicle={selectedCrewVehicle}
                drivers={state.drivers}
                vehicles={state.vehicles}
                dispatch={dispatch}
                funds={state.funds}
                requestConfirm={requestConfirm}
                onSelectVehicle={(vid) => { setSelectedDriverId(null); setSelectedVehicleId(vid); setInspectorTab('details'); }}
                onSelectDriver={(did) => { setSelectedVehicleId(null); setSelectedDriverId(did); setInspectorTab('details'); }}
              />
            ) : (
              <InspectorEmpty state={state} />
            )}
          </div>
        </div>
      </div>

      <div className="mobile-tabs" role="tablist" aria-label="游戏主区域">
        <button className={mobileTab === 'fleet' ? 'active' : ''} onClick={() => setMobileTab('fleet')}>车队</button>
        <button className={mobileTab === 'city' ? 'active' : ''} onClick={() => setMobileTab('city')}>城市</button>
        <button className={mobileTab === 'inspector' ? 'active' : ''} onClick={() => setMobileTab('inspector')}>调度</button>
      </div>

      {state.showTutorial && <Tutorial onClose={() => dispatch({type: 'CLOSE_TUTORIAL'})} />}
      {state.activeEvent && <EventModal event={state.activeEvent} state={state}
        onResolve={(idx) => dispatch({type: 'RESOLVE_EVENT', optionIdx: idx})}
        onResolveInvestor={(choices) => dispatch({type: 'RESOLVE_INVESTOR', choices})} />}
      {state.activeStory && <StoryModal story={state.activeStory} drivers={state.drivers} onClose={() => dispatch({type: 'STORY_SHOWN'})} />}
      {state.showMonthlyReport && <MonthlyReportModal report={state.showMonthlyReport} onClose={() => dispatch({type: 'CLOSE_MONTHLY_REPORT'})} />}
      {hasFinaleMissionNotice && (
        <MissionToast mission={state.newMissionComplete} onClose={() => dispatch({type: 'CLEAR_MISSION_COMPLETE'})} />
      )}
      {showFeedbackStack && (
        <div className="game-feedback-stack" aria-live="polite">
          {state.newMissionComplete && !hasFinaleMissionNotice && (
            <MissionToast mission={state.newMissionComplete} onClose={() => dispatch({type: 'CLEAR_MISSION_COMPLETE'})} />
          )}
        </div>
      )}
      {state.newEndingUnlocked && !state.gameOver && (
        <EndingUnlockModal
          ending={state.newEndingUnlocked}
          onClaim={() => dispatch({type: 'CLAIM_ENDING'})}
          onContinue={() => dispatch({type: 'CLEAR_NEW_ENDING'})}
        />
      )}
      {(showRecruit || state.gachaCards) && (
        <RecruitModal
          state={state}
          dispatch={dispatch}
          onClose={() => { setShowRecruit(false); dispatch({type: 'GACHA_CANCEL'}); }}
        />
      )}
      {showShop && <ShopModal state={state} onClose={() => setShowShop(false)} onBuyVehicle={(t) => { dispatch({type: 'BUY_VEHICLE', templateId: t}); setShowShop(false); }} />}
      {showRoadmap && <UnlockRoadmapModal state={state} onClose={() => setShowRoadmap(false)} onOpenShop={() => setShowShop(true)} />}
      {state.gameOver && <EndingModal ending={state.gameOver} onReset={() => dispatch({type: 'RESET'})} />}
      {confirmOpts && (
        <ConfirmModal
          {...confirmOpts}
          onClose={() => setConfirmOpts(null)}
        />
      )}

      {state.notifications.length > 0 && state.notifications.slice(-1).map((n) => (
        <div key={n.id} className={`notification notification-${n.level || 'info'}`}>{n.text}</div>
      ))}

      {configUpdated && (
        <div className="config-update-banner">
          <span>数值后台已更新配置</span>
          <button className="btn btn-primary btn-xs" onClick={() => location.reload()}>重启游戏应用</button>
          <button className="btn btn-ghost btn-xs" onClick={() => setConfigUpdated(false)}>稍后</button>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
