<!-- V5 实时同步:从 localStorage 加载 admin 后台覆盖配置 -->
<script>
(function() {
  function hasFunctionDeep(value) {
    if (typeof value === 'function') return true;
    if (!value || typeof value !== 'object') return false;
    if (Array.isArray(value)) return value.some(hasFunctionDeep);
    return Object.keys(value).some((key) => hasFunctionDeep(value[key]));
  }

  function mergeConfigValue(orig, ov) {
    if (ov === undefined) return orig;
    if (typeof orig === 'function') return orig;
    if (Array.isArray(orig) && Array.isArray(ov)) {
      const hasIdItems = ov.some((item) => item && typeof item === 'object' && item.id !== undefined);
      const origHasIdItems = orig.some((item) => item && typeof item === 'object' && item.id !== undefined);
      if (hasIdItems && origHasIdItems) {
        const next = orig.slice();
        ov.forEach((newItem) => {
          if (!newItem || typeof newItem !== 'object' || newItem.id === undefined) return;
          const idx = next.findIndex((x) => x && x.id === newItem.id);
          if (idx >= 0) next[idx] = mergeConfigValue(next[idx], newItem);
        });
        return next;
      }
      if (hasFunctionDeep(orig)) {
        return orig.map((item, idx) => mergeConfigValue(item, ov[idx]));
      }
      return ov.slice();
    }
    if (orig && ov && typeof orig === 'object' && typeof ov === 'object') {
      const next = { ...orig };
      Object.keys(ov).forEach((key) => {
        next[key] = mergeConfigValue(orig[key], ov[key]);
      });
      return next;
    }
    return ov;
  }

  try {
    const saved = JSON.parse(localStorage.getItem('wycwy-config-override') || 'null');
    if (!saved || !window.WYCWY_DATA) return;
    Object.keys(saved).forEach((key) => {
      if (window.WYCWY_DATA[key] === undefined) return;
      window.WYCWY_DATA[key] = mergeConfigValue(window.WYCWY_DATA[key], saved[key]);
    });
    const minFares = (window.WYCWY_DATA.GAME && window.WYCWY_DATA.GAME.MIN_ORDER_FARES) || {};
    if (Array.isArray(window.WYCWY_DATA.ORDERS)) {
      window.WYCWY_DATA.ORDERS = window.WYCWY_DATA.ORDERS.map((order) => {
        const minFare = minFares[order.id];
        return minFare ? { ...order, fare: Math.max(order.fare || 0, minFare) } : order;
      });
    }
    console.log('[WYCWY] 已加载后台覆盖配置');
  } catch (e) { console.error('[WYCWY] 配置覆盖加载失败:', e); }
})();
</script>
