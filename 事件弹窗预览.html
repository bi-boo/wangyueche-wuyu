<!DOCTYPE html>
<html lang="zh">

<meta charset="UTF-8">

<meta http-equiv="Pragma" content="no-cache">

<title>事件弹窗预览(实时数据 Storybook)</title>
<link rel="icon" href="data:,">
<!-- 预览页直接读取当前 data / engine。弹窗渲染器内置在本页,确保 file:// 双击也能预览。 -->
<link rel="stylesheet" href="src/styles/00-tokens.css">
<link rel="stylesheet" href="src/styles/10-base.css">

<style>
  html, body { height: 100%; margin: 0; padding: 0; background: #f3eedb; }
  #root { height: 100vh; display: flex; flex-direction: row; overflow: hidden; }

  /* 左侧栏 */
  .sb-sidebar {
    width: 300px; flex-shrink: 0;
    background: #1d1a18; color: #ddd;
    overflow-y: auto;
    z-index: 100;
    box-shadow: 2px 0 12px rgba(0,0,0,0.2);
  }
  .sb-sidebar-header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky; top: 0;
    background: #1d1a18;
    z-index: 1;
  }
  .sb-sidebar-header h1 { font-size: 14px; margin: 0 0 4px; color: #ffb74d; font-weight: 600; }
  .sb-sidebar-header .sub { font-size: 11px; color: #999; }
  .sb-controls {
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 12px; color: #bbb;
  }
  .sb-controls input {
    width: 100%; padding: 4px 8px; margin-top: 4px;
    border-radius: 3px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: #fff; font-family: inherit;
    font-size: 12px;
  }
  .sb-group { padding: 12px 0 6px; }
  .sb-group-title {
    padding: 4px 16px; font-size: 11px; font-weight: 600;
    color: #ff6b35; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .sb-item {
    display: block; width: 100%;
    padding: 7px 16px 7px 24px;
    background: transparent; border: none;
    color: #ccc; font-size: 12px; text-align: left;
    cursor: pointer;
    font-family: inherit;
    border-left: 3px solid transparent;
    line-height: 1.45;
  }
  .sb-item:hover { background: rgba(255,255,255,0.04); color: #fff; }
  .sb-item.active {
    background: rgba(255,107,53,0.18);
    color: #fff;
    border-left-color: #ff6b35;
    font-weight: 500;
  }
  .sb-item .stage-tag {
    display: inline-block;
    padding: 1px 6px; margin-left: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    font-size: 10px; color: #aaa;
  }
  .sb-item.active .stage-tag {
    background: rgba(255,255,255,0.18); color: #fff;
  }

  /* 主区 - modal 限制在这里显示 */
  .sb-stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #f3eedb;
  }
  .sb-stage-empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #888; font-size: 14px;
  }
  /* 关键:让 modal-overlay 在 storybook 里限制在主区 */
  .sb-stage .modal-overlay {
    position: absolute !important;
    inset: 0;
    z-index: 50;
    padding-top: 56px !important;
  }
  .sb-meta-banner {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 200;
    background: #1d1a18;
    color: #ffb74d;
    padding: 10px 16px;
    font-size: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .sb-meta-banner b { color: #888; font-weight: 500; margin-right: 4px; }
  .sb-meta-banner code {
    color: #fff;
    background: rgba(255,255,255,0.08);
    padding: 1px 6px;
    border-radius: 2px;
    font-family: "JetBrains Mono", "Menlo", monospace;
    font-size: 11px;
  }

  /* 剧情预览 */
  .story-preview-modal {
    width: min(720px, calc(100vw - 80px));
    max-height: calc(100vh - 112px);
    overflow-y: auto;
  }
  .story-preview-tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .story-preview-state-tag {
    background: #1d1a18;
    color: #ffcc66;
  }
  .story-image-frame {
    height: clamp(188px, 29vw, 270px);
    margin: 12px 0 16px;
    overflow: hidden;
    border: 4px solid #1d1a18;
    background: #1d1a18;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.16);
  }
  .story-image-frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
  }
  .story-dialogue {
    display: grid;
    gap: 8px;
    margin: 0 0 14px;
    color: #332820;
    font-size: 14px;
    line-height: 1.72;
  }
  .story-dialogue p {
    margin: 0;
  }
  @media (max-width: 760px) {
    #root {
      flex-direction: column;
    }
    .sb-sidebar {
      width: 100%;
      height: 260px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    }
    .sb-stage {
      min-height: 0;
    }
    .sb-stage .modal-overlay {
      padding: 12px !important;
      align-items: flex-start;
    }
    .story-preview-modal {
      width: min(100%, 560px);
      max-height: calc(100% - 24px);
    }
    .story-image-frame {
      height: 156px;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="wycwy-data.js"></script>
<script src="wycwy-engine.js"></script>

<script type="text/babel">
  const { useState, useMemo } = React;

  // 组件未加载时的明确提示(替代空白)
  function ComponentMissingError({ name }) {
    return (
      <div style={{
        position: 'absolute', inset: 0,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: 40,
      }}>
        <div style={{
          maxWidth: 520, padding: 24,
          background: '#fff3cd', border: '2px solid #ffc107', borderRadius: 8,
          color: '#664d03', fontSize: 14, lineHeight: 1.6,
        }}>
          <div style={{fontSize: 16, fontWeight: 600, marginBottom: 12}}>⚠ 组件 <code>{name}</code> 未定义</div>
          <div>当前预览页没有拿到 <code>{name}</code>。如果你看到这条提示,说明内置预览渲染器也没有启动,请重新打开本文件或检查控制台报错。</div>
          <ul style={{marginTop: 8, paddingLeft: 20}}>
            <li>确认同目录下存在 <code>wycwy-data.js</code> 和 <code>wycwy-engine.js</code></li>
            <li>刷新后仍异常时,查看 DevTools Console 的第一条红色报错</li>
          </ul>
        </div>
      </div>
    );
  }

  function formatMoney(value) {
    return `¥${Math.round(value || 0).toLocaleString()}`;
  }

  function formatSignedNumber(value) {
    return `${value > 0 ? '+' : ''}${value}`;
  }

  function getToneByValue(value) {
    if (value > 0) return 'positive';
    if (value < 0) return 'negative';
    return '';
  }

  function normalizeNarrativePunctuation(text) {
    if (typeof text !== 'string') return text;
    let quoteOpen = true;
    return text
      .replace(/([\u4e00-\u9fff])\s*,\s*/g, '$1，')
      .replace(/,\s*([\u4e00-\u9fff])/g, '，$1')
      .replace(/([\u4e00-\u9fff])\s*:\s*/g, '$1：')
      .replace(/:\s*([\u4e00-\u9fff])/g, '：$1')
      .replace(/\(/g, '（')
      .replace(/\)/g, '）')
      .replace(/\?/g, '？')
      .replace(/!/g, '！')
      .replace(/"/g, () => {
        const mark = quoteOpen ? '“' : '”';
        quoteOpen = !quoteOpen;
        return mark;
      });
  }

  function formatNarrativeText(text, maxLineLength = 34) {
    const normalized = normalizeNarrativePunctuation(text);
    if (typeof normalized !== 'string' || normalized.includes('\n') || normalized.length <= maxLineLength) {
      return normalized;
    }
    const sentences = normalized.match(/[^。！？]+[。！？]?/g);
    if (!sentences || sentences.length <= 1) return normalized;
    const lines = [];
    let current = '';
    sentences.forEach((sentence) => {
      if (current && `${current}${sentence}`.length > maxLineLength) {
        lines.push(current);
        current = sentence;
      } else {
        current += sentence;
      }
    });
    if (current) lines.push(current);
    return lines.join('\n');
  }

  function PreviewResourceSnapshot({ state, thirdLabel = '司机/车辆', thirdValue = null, thirdTone = '' }) {
    const assigned = (state.drivers || []).filter((driver) => driver.vehicleId).length;
    const totalVehicles = (state.vehicles || []).length;
    const metrics = [
      { label: '资金', value: formatMoney(state.funds), tone: state.funds < 0 ? 'danger' : '' },
      { label: '口碑', value: state.reputation },
    ];
    if (thirdLabel && thirdValue !== null) {
      metrics.push({ label: thirdLabel, value: thirdValue, tone: thirdTone });
    }
    metrics.push({ label: '司机/车辆', value: `${assigned}/${totalVehicles}` });
    return (
      <div className="event-resource-snapshot" aria-label="当前经营状态">
        {metrics.map((metric) => (
          <div key={metric.label}>
            <span>{metric.label}</span>
            <strong className={metric.tone || ''}>{metric.value}</strong>
          </div>
        ))}
      </div>
    );
  }

  function summarizeApplyEffect(event, option, state) {
    if (typeof option?.apply !== 'function') return [];
    try {
      const raw = option.apply(state) || {};
      const effect = (event?.skipScale || raw.skipScale || !E.scaleEventEffect)
        ? raw
        : E.scaleEventEffect(raw, state);
      const items = [];
      const add = (text, tone = '') => items.push({ text, tone });
      if (effect.funds !== undefined) add(`资金 ${effect.funds > 0 ? '+' : ''}${formatMoney(effect.funds).replace('¥-', '-¥')}`, getToneByValue(effect.funds));
      if (effect.reputation !== undefined) add(`口碑 ${formatSignedNumber(effect.reputation)}`, getToneByValue(effect.reputation));
      if (effect.allLoyalty !== undefined) add(`全员忠诚 ${formatSignedNumber(effect.allLoyalty)}`, getToneByValue(effect.allLoyalty));
      if (effect.trustLoyalty !== undefined) add(`全员信任 ${formatSignedNumber(effect.trustLoyalty)}`, getToneByValue(effect.trustLoyalty));
      if (effect.salaryRaise) add(`月薪 +${formatMoney(effect.salaryRaise)}`, 'negative');
      if (effect.orderBoost) add(`订单量 ${Math.round(effect.orderBoost * 100)}%${effect.boostDuration ? `(${effect.boostDuration} 天)` : ''}`, effect.orderBoost >= 1 ? 'positive' : 'negative');
      if (effect.addDrivers) add(`新增司机 +${effect.addDrivers}`, 'positive');
      if (effect.addVehicles) add(`新增车辆 +${effect.addVehicles}`, 'positive');
      if (effect.certifyFleet) add('当前车辆合规升级', 'positive');
      if (effect.platformDone) add('后续不再涨抽成', 'positive');
      if (effect.commissionRate !== undefined) add(`平台抽成 ${Math.round(effect.commissionRate * 100)}%`);
      if (effect.accidentRisk) add(`${Math.round((effect.accidentRisk.chance || 0) * 100)}% 事故风险`, 'negative');
      return items;
    } catch (err) {
      return [{ text: '预览效果计算失败,以实际游戏结算为准', tone: 'negative' }];
    }
  }

  function PreviewEffectChips({ items }) {
    if (!items || !items.length) return null;
    return (
      <div className="event-effect-preview">
        {items.map((item, idx) => (
          <span key={idx} className={item.tone || ''}>{normalizeNarrativePunctuation(item.text)}</span>
        ))}
      </div>
    );
  }

  function StoryPreviewImage({ story }) {
    return (
      <div className="story-image-frame">
        <img src={story.image} alt="" draggable="false" />
      </div>
    );
  }

  function PreviewStoryModal({ story }) {
    return (
      <div className="modal-overlay">
        <div className="modal event-modal story-preview-modal">
          <div className="story-preview-tag-row">
            <div className="modal-tag">{story.tag}</div>
            <div className="modal-tag story-preview-state-tag">预览状态</div>
          </div>
          <div className="modal-title">{story.title}</div>
          <StoryPreviewImage story={story} />
          <div className="story-dialogue">
            {story.paragraphs.map((line, idx) => <p key={idx}>{formatNarrativeText(line, 42)}</p>)}
          </div>
          <div className="modal-options">
            {story.buttons.map((label) => (
              <button key={label} className="modal-option" onClick={() => console.log('剧情预览按钮', label)}>
                <div className="modal-option-label">{label}</div>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  function PreviewInvestorPressureModal({ event, state, onResolve }) {
    const [fire, setFire] = useState(false);
    const [sell, setSell] = useState(false);
    const [debt, setDebt] = useState(false);
    const plan = E.getInvestorPressurePlan ? E.getInvestorPressurePlan(state) : null;
    const fireDisabled = !plan || !plan.fireDrivers?.length;
    const sellDisabled = !plan || !plan.sellVehicles?.length;
    const daysLeft = Math.max(0, (D.GAME?.DEATH_FUNDS_DAYS || 5) + (state.bankruptcyGraceBonus || 0) - (state.negFundsDays || 0));
    const anyPicked = fire || sell || debt;
    const fireNames = (plan?.fireDrivers || []).slice(0, 3).map((driver) => driver.name).join('、');
    const sellNames = (plan?.sellVehicles || []).slice(0, 3).map((vehicle) => {
      const tpl = E.getVehicleData ? E.getVehicleData(vehicle) : null;
      return tpl?.name || vehicle.name || vehicle.templateId;
    }).join('、');
    return (
      <div className="modal-overlay">
        <div className="modal event-modal">
          <div className="event-modal-header">
            <div className="modal-tag">{event.tag}事件</div>
            <div className="modal-title">{event.title}</div>
            <div className="modal-desc">{formatNarrativeText(event.desc)}</div>
          </div>
          <PreviewResourceSnapshot state={state} thirdLabel="距破产" thirdValue={`${daysLeft} 天`} thirdTone="danger" />
          <div className="investor-choices">
            <label className={`investor-choice ${fireDisabled ? 'disabled' : ''}`}>
              <input type="checkbox" checked={fire} disabled={fireDisabled} onChange={(e) => setFire(e.target.checked)} />
              <div className="investor-choice-body">
                <div className="investor-choice-label">{fireDisabled ? '裁员止血 — 当前不可裁' : `裁撤 ${plan.fireDrivers.length} 名高薪司机`}</div>
                {!fireDisabled && <div className="investor-choice-detail">{fireNames} · 月省 {formatMoney(plan.monthlySavings)} · 破产宽容 +{plan.fireGraceDays} 天</div>}
              </div>
            </label>
            <label className={`investor-choice ${sellDisabled ? 'disabled' : ''}`}>
              <input type="checkbox" checked={sell} disabled={sellDisabled} onChange={(e) => setSell(e.target.checked)} />
              <div className="investor-choice-body">
                <div className="investor-choice-label">{sellDisabled ? '卖车回血 — 当前不可卖' : `卖出 ${plan.sellVehicles.length} 辆高价车辆`}</div>
                {!sellDisabled && <div className="investor-choice-detail">{sellNames} · 立刻 +{formatMoney(plan.sellRefund)}(60% 残值)</div>}
              </div>
            </label>
            <label className="investor-choice">
              <input type="checkbox" checked={debt} onChange={(e) => setDebt(e.target.checked)} />
              <div className="investor-choice-body">
                <div className="investor-choice-label">借高利贷 {formatMoney(plan?.debtPrincipal || 10000)}</div>
                <div className="investor-choice-detail">{plan?.debtPeriodDays || 30} 天后还 {formatMoney(plan?.debtRepay || 12000)}</div>
              </div>
            </label>
          </div>
          <div className="investor-actions">
            <button className="btn btn-primary" disabled={!anyPicked} onClick={() => onResolve({ fire, sell, debt })}>提交方案{anyPicked ? '' : ' (至少选 1 项)'}</button>
            <div className="investor-divider">或</div>
            <button className="btn btn-ghost" disabled={anyPicked} onClick={() => onResolve({ holdOn: true })}>不采取措施,靠流水回正</button>
            <div className="investor-hold-note">若 <strong>{daysLeft} 天内资金没有回正</strong>,投资人撤资,游戏结束。</div>
          </div>
        </div>
      </div>
    );
  }

  function PreviewEventModal({ event, state, onResolve, onResolveInvestor }) {
    if (!event) return <ComponentMissingError name="EventModal" />;
    if (event.multiChoice) {
      return <PreviewInvestorPressureModal event={event} state={state} onResolve={onResolveInvestor} />;
    }
    if (event.isPolicyEvent) {
      return <PreviewPolicyNoticeModal event={event} state={state} onResolve={onResolve} />;
    }
    return (
      <div className="modal-overlay">
        <div className="modal event-modal">
          <div className="event-modal-header">
            <div className="modal-tag">{event.tag}事件</div>
            <div className="modal-title">{event.title}</div>
            <div className="modal-desc">{formatNarrativeText(event.desc)}</div>
          </div>
          <PreviewResourceSnapshot state={state} />
          <div className="modal-options">
            {(event.options || []).map((option, idx) => {
              const effectItems = event.blindOptions ? [] : summarizeApplyEffect(event, option, state);
              const optionDetail = event.blindOptions || effectItems.length === 0 ? option.detail : '';
              return (
                <button key={idx} className="modal-option" onClick={() => onResolve(idx)}>
                  <div className="modal-option-label">{option.label}</div>
                  {optionDetail && <div className="modal-option-effect" style={{whiteSpace: 'pre-line'}}>{normalizeNarrativePunctuation(optionDetail)}</div>}
                  <PreviewEffectChips items={effectItems} />
                </button>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  function PreviewPolicyNoticeModal({ event, state, onResolve }) {
    const previews = event.policyEffectPreview || [];
    const footerNote = event.policyFooterNote || '';
    const buttonLabel = event.options?.[0]?.label || '知道了';
    const isBan = event.policyStage === 'verdict_ban';
    return (
      <div className="modal-overlay">
        <div className={`modal event-modal policy-notice-modal ${isBan ? 'policy-notice-ban' : ''}`}>
          <div className="event-modal-header">
            <div className="modal-tag">{event.tag || '政策事件'}</div>
            <div className="modal-title">{event.title}</div>
            <div className="modal-desc" style={{whiteSpace: 'pre-line'}}>{formatNarrativeText(event.desc)}</div>
          </div>
          {previews.length > 0 && (
            <div className="policy-effect-list">
              {(event.policyStage === 'verdict_ban' || event.policyStage === 'verdict_fine') && (
                <div className="policy-effect-heading">处罚清单</div>
              )}
              {previews.map((eff, idx) => (
                <div key={idx} className={`policy-effect-row ${eff.tone || ''}`}>
                  <span className="policy-effect-label">{eff.label}</span>
                  <strong className="policy-effect-value">{eff.value}</strong>
                </div>
              ))}
            </div>
          )}
          {footerNote && <div className="policy-footer-note">{footerNote}</div>}
          <div className="modal-options">
            <button className="modal-option" onClick={() => onResolve(0)}>
              <div className="modal-option-label">{buttonLabel}</div>
            </button>
          </div>
        </div>
      </div>
    );
  }

  function PreviewPolicyDecisionModal({ decision, state, onResolve }) {
    const [extraToggles, setExtraToggles] = useState({});
    const r0 = decision.refMonthlyRevenue || 0;
    const params = decision.params || {};
    const startupFee = Math.round(r0 * (params.A_STARTUP_FEE_PCT || 0.40));
    const schedule = params.COMPLIANCE_SCHEDULE_PCT || [0.25, 0.20, 0.15, 0.10];
    const complianceFirstPct = Math.round((schedule[0] || 0.25) * 100);
    const complianceFloorPct = Math.round((schedule[schedule.length - 1] || 0.10) * 100);
    const loanAmount = Math.round(r0 * (params.B_LOAN_PCT || 1.00));
    const loanInterest = Math.round(loanAmount * (params.B_LOAN_RATE || 0.10) * ((params.B_LOAN_DUE_DAYS || 90) / 365));
    const loanRepay = loanAmount + loanInterest;
    const renderDecisionEffects = (optId) => {
      if (optId === 'A') {
        return (
          <PreviewEffectChips items={[
            { text: `立即扣 ${formatMoney(startupFee)}`, tone: 'negative' },
            { text: `月合规成本:首月 ${complianceFirstPct}% → 稳定后 ${complianceFloorPct}%`, tone: 'negative' },
            { text: '30 天内招募/购车 5 天冷却', tone: 'negative' },
          ]} />
        );
      }
      if (optId === 'B') {
        return (
          <PreviewEffectChips items={[
            { text: '订单量 +25%', tone: 'positive' },
            { text: '单均利润 +15%', tone: 'positive' },
            { text: '持续 30 天' },
          ]} />
        );
      }
      return null;
    };
    return (
      <div className="modal-overlay">
        <div className="modal event-modal policy-decision-modal">
          <div className="event-modal-header">
            <div className="modal-tag">{decision.tag || '政策决策'}</div>
            <div className="modal-title">{decision.title}</div>
            <div className="modal-desc" style={{whiteSpace: 'pre-line'}}>{formatNarrativeText(decision.desc)}</div>
          </div>
          <PreviewResourceSnapshot state={state} />
          <div className="modal-options">
            {(decision.options || []).map((opt) => {
              const toggleVal = extraToggles[opt.id] || {};
              return (
                <div key={opt.id} className={`policy-decision-card policy-decision-${opt.id}`}>
                  <button className="policy-decision-main" onClick={() => onResolve(opt.id, toggleVal)}>
                    <div className="modal-option-label">{opt.label}</div>
                    {opt.detail && <div className="modal-option-effect" style={{whiteSpace: 'pre-line'}}>{normalizeNarrativePunctuation(opt.detail)}</div>}
                    {renderDecisionEffects(opt.id)}
                  </button>
                  {opt.extraToggle && (
                    <label className="policy-decision-toggle" onClick={(e) => e.stopPropagation()}>
                      <input
                        type="checkbox"
                        checked={!!toggleVal[opt.extraToggle.id]}
                        onChange={(e) => setExtraToggles({
                          ...extraToggles,
                          [opt.id]: { ...(extraToggles[opt.id] || {}), [opt.extraToggle.id]: e.target.checked },
                        })}
                      />
                      <span className="policy-decision-toggle-copy">
                        <strong>{opt.extraToggle.label}</strong>
                        <span>一次性 <span className="positive">+{formatMoney(loanAmount)}</span> · 90 天后还本付息 <span className="negative">{formatMoney(loanRepay)}</span></span>
                      </span>
                    </label>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // -------- 数据准备 --------
  const D = window.WYCWY_DATA;
  const E = window.WYCWY_ENGINE;

  const STORY_PREVIEWS = Object.values(D.PLAYER_STORIES || {});

  // 政策事件:每个 stage 一个左侧栏项
  function buildPolicySidebarItems() {
    const out = [];
    (D.POLICY_EVENTS || []).forEach((ev) => {
      const stages = ev.stages || {};
      Object.keys(stages).forEach((stageKey) => {
        out.push({
          id: `policy_${ev.id}_${stageKey}`,
          title: stages[stageKey].title,
          stageTag: stageKeyToShortLabel(ev, stageKey),
          kind: 'policy',
          policyEventId: ev.id,
          policyStage: stageKey,
        });
      });
    });
    return out;
  }
  function stageKeyToShortLabel(ev, stageKey) {
    if (ev.id !== 'gov_ban') return stageKey;
    const map = {
      notice_1: 'Day 30',
      decision: 'Day 60 决策',
      verdict_pass: 'Day 90 通过',
      verdict_fine: 'Day 90 轻罚',
      verdict_ban: 'Day 90 整改',
      resume: 'Day 150 解禁',
    };
    return map[stageKey] || stageKey;
  }

  const CHAIN_GROUP_ORDER = ['borrow', 'accident', 'rival', 'complaint_harass'];
  const CHAIN_GROUP_LABELS = {
    borrow: '链式 · borrow 老张借钱',
    accident: '链式 · accident 司机事故',
    rival: '链式 · rival 竞品挖人(钥匙司机)',
    complaint_harass: '链式 · complaint 投诉反转',
  };
  const PHASE_LABELS = { early: '早期', mid: '中期', late: '后期' };
  const PHASE_ORDER = { early: 1, mid: 2, late: 3 };

  function getChainGroup(ev) {
    if (!ev || (ev.eventType !== 'chain' && !ev.chainId)) return null;
    return ev.chainId || ev.chain || null;
  }

  function getEventStageTag(ev) {
    if (ev.scripted || ev.eventType === 'scripted') return `脚本 · ${ev.tag}`;
    if (ev.eventType === 'chain' || ev.chainId) {
      return `最早D${ev.minDay || 0} · S${ev.stage || 1} · ${ev.tag}`;
    }
    const phase = PHASE_LABELS[ev.phase || 'early'] || '早期';
    return `${phase} · 最早D${ev.minDay || 0} · ${ev.tag}`;
  }

  function buildRandomEventSidebarItems() {
    const allEvents = D.EVENTS || [];
    const chainGroups = {};
    const single = [];
    const scripted = [];
    const sortBySchedule = (a, b) => {
      const ea = allEvents.find(e => e.id === a.eventId);
      const eb = allEvents.find(e => e.id === b.eventId);
      return (ea.minDay || 0) - (eb.minDay || 0)
        || (PHASE_ORDER[ea.phase || 'early'] || 1) - (PHASE_ORDER[eb.phase || 'early'] || 1)
        || (ea.stage || 0) - (eb.stage || 0);
    };
    allEvents.forEach((ev) => {
      const baseItem = {
        id: `event_${ev.id}`,
        title: ev.title,
        stageTag: getEventStageTag(ev),
        kind: 'event',
        eventId: ev.id,
      };
      if (ev.scripted || ev.eventType === 'scripted') {
        scripted.push(baseItem);
        return;
      }
      const group = getChainGroup(ev);
      if (group) {
        if (!chainGroups[group]) chainGroups[group] = [];
        chainGroups[group].push(baseItem);
      } else {
        single.push(baseItem);
      }
    });
    Object.values(chainGroups).forEach(arr => arr.sort(sortBySchedule));
    single.sort(sortBySchedule);
    scripted.sort(sortBySchedule);
    return { chainGroups, single, scripted };
  }

  function buildInvestorSidebarItem() {
    return {
      id: 'investor_pressure',
      title: '投资人压力',
      stageTag: '危机',
      kind: 'investor',
    };
  }

  const INVESTOR_REVIEW_STAGE_ORDER = ['early_warning', 'early_final'];
  const INVESTOR_REVIEW_STAGE_LABELS = {
    early_warning: 'Day 30+',
    early_final: 'Day 60+',
  };

  function buildInvestorReviewSidebarItems() {
    const stages = D.INVESTOR_REVIEW?.stages || {};
    return INVESTOR_REVIEW_STAGE_ORDER
      .filter((stageKey) => stages[stageKey])
      .map((stageKey) => ({
        id: `investor_review_${stageKey}`,
        title: stages[stageKey].title,
        stageTag: INVESTOR_REVIEW_STAGE_LABELS[stageKey] || stageKey,
        kind: 'investorReview',
        investorReviewStage: stageKey,
      }));
  }

  function buildStoryPreviewSidebarItems() {
    return STORY_PREVIEWS.map((story) => ({
      id: story.id,
      title: story.title,
      stageTag: story.id === 'opening_layoff' ? '游戏开始' : 'IPO 终局',
      kind: 'storyPreview',
      storyId: story.id,
    }));
  }

  // -------- mock state --------
  const baseInitial = E.makeInitialState();
  const MOCK_STATE = {
    ...baseInitial,
    funds: 75695,
    reputation: 401,
    todayEarned: 144,
    day: 60,
    hour: 14,
  };
  const SNOW_RESCUE_MOCK_STATE = {
    ...MOCK_STATE,
    funds: -10000,
    day: 11,
    hour: 0,
    negFundsDays: Math.max(1, (D.GAME?.DEATH_FUNDS_DAYS || 5) - 1),
    investorPressureFired: true,
  };
  // 投资人事件需要资金负 + 可裁的司机/可卖的车
  const INVESTOR_MOCK_STATE = {
    ...baseInitial,
    funds: -3500,
    reputation: 280,
    day: 50,
    hour: 6,
  };
  const INVESTOR_REVIEW_MOCK_STATE = {
    ...baseInitial,
    funds: 42000,
    reputation: 180,
    day: 60,
    hour: 9,
    drivers: baseInitial.drivers.map((driver, idx) => ({
      ...driver,
      vehicleId: baseInitial.vehicles[idx]?.id || driver.vehicleId,
    })),
  };

  // -------- render helpers --------
  function buildPolicyEventForStage(eventId, stageKey, r0) {
    const ev = D.POLICY_EVENTS.find((e) => e.id === eventId);
    if (!ev) return null;
    const stageData = ev.stages[stageKey];
    if (!stageData) return null;
    const params = ev.params;

    if (stageKey === 'decision') {
      return {
        type: 'policyDecision',
        decision: {
          eventId, stage: stageKey,
          title: stageData.title, tag: stageData.tag, desc: stageData.desc,
          options: stageData.options,
          refMonthlyRevenue: r0,
          params,
        },
      };
    }

    let previews = [];
    let footerNote = '';
    if (stageKey === 'verdict_fine') {
      previews = [
        { label: '象征性罚款', value: `-¥${Math.round(r0 * params.A_VERDICT_FINE_PCT).toLocaleString()}`, tone: 'negative' },
      ];
    } else if (stageKey === 'verdict_ban') {
      const schedule = params.COMPLIANCE_SCHEDULE_PCT || [0.25, 0.20, 0.15, 0.10];
      const firstPct = Math.round((schedule[0] || 0.25) * 100);
      const floorPct = Math.round((schedule[schedule.length - 1] || 0.10) * 100);
      previews = [
        { label: '立即罚款', value: `-¥${Math.round(r0 * params.B_FINE_PCT).toLocaleString()}`, tone: 'negative' },
        { label: '60 天禁运 · 订单量', value: `降至 ${Math.round(params.B_BAN_ORDER_BOOST * 100)}%(60 天)`, tone: 'negative' },
        { label: '强制启动月合规成本', value: `按每月净流水滚动扣:首月 ${firstPct}% → 稳定后 ${floorPct}%`, tone: 'negative' },
      ];
      footerNote = '整改期间运营成本需照常承担。如需止损,可在车队管理界面卖车或裁员。';
    } else if (stageKey === 'resume') {
      previews = [
        { label: '禁运解除 · 订单量', value: '恢复至 100%', tone: 'positive' },
      ];
    }

    return {
      type: 'policyNotice',
      event: {
        id: `policy_${eventId}_${stageKey}`,
        title: stageData.title, tag: stageData.tag, desc: stageData.desc,
        isPolicyEvent: true,
        policyEventId: eventId,
        policyStage: stageKey,
        policyEffectPreview: previews,
        policyFooterNote: footerNote,
        options: [{ label: stageData.buttonLabel || '知道了', detail: '', apply: () => ({}) }],
      },
    };
  }

  function buildRandomEventModal(eventId) {
    const ev = D.EVENTS.find((e) => e.id === eventId);
    if (!ev) return null;
    return { type: 'event', event: { ...ev } };
  }

  function buildInvestorModal() {
    return {
      type: 'investor',
      event: D.INVESTOR_PRESSURE,
    };
  }

  function buildInvestorReviewModal(stageKey) {
    const review = D.INVESTOR_REVIEW;
    const stageData = review?.stages?.[stageKey];
    if (!stageData) return null;
    const punishment = review?.punishment?.[stageKey] || {};
    const scheduleItem = (review?.schedule || []).find((item) => item.stage === stageKey);
    const ctx = {
      fee: punishment.fee || 0,
      targetCrews: scheduleItem?.targetCrews || review?.targetCrews || review?.kpi?.targetCrews || 3,
      currentCrews: INVESTOR_REVIEW_MOCK_STATE.drivers.filter((driver) => driver.vehicleId).length,
    };
    ctx.deadlineDays = Math.max(1, review?.finalDeadlineDays || 10);
    ctx.deadlineDay = INVESTOR_REVIEW_MOCK_STATE.day + ctx.deadlineDays;
    let desc = stageData.desc || '';
    desc = desc
      .replace(/\{N\}/g, ctx.fee.toLocaleString())
      .replace(/\{targetCrews\}/g, ctx.targetCrews)
      .replace(/\{currentCrews\}/g, ctx.currentCrews)
      .replace(/\{D\}/g, ctx.deadlineDays)
      .replace(/\{deadlineDay\}/g, ctx.deadlineDay);
    const buildDetail = (detail) => (detail || '')
      .replace(/\{targetCrews\}/g, ctx.targetCrews)
      .replace(/\{currentCrews\}/g, ctx.currentCrews)
      .replace(/\{D\}/g, ctx.deadlineDays)
      .replace(/\{deadlineDay\}/g, ctx.deadlineDay);
    const options = stageData.options
      ? stageData.options.map((opt) => ({ label: opt.label, detail: buildDetail(opt.detail), apply: () => (ctx.fee > 0 ? { funds: -ctx.fee } : {}) }))
      : [{ label: stageData.buttonLabel || '知道了', detail: buildDetail(stageData.buttonDetail), apply: () => (ctx.fee > 0 ? { funds: -ctx.fee } : {}) }];
    return {
      type: 'investorReview',
      event: {
        id: `investor_review_${stageKey}`,
        title: stageData.title,
        tag: stageData.tag,
        desc,
        isInvestorReview: true,
        investorReviewStage: stageKey,
        investorReviewFee: ctx.fee,
        investorReviewFeeLabel: punishment.label || '',
        skipScale: true,
        options,
      },
    };
  }

  function buildStoryPreviewModal(storyId) {
    const story = STORY_PREVIEWS.find((item) => item.id === storyId);
    if (!story) return null;
    return { type: 'storyPreview', story };
  }

  function StorybookApp() {
    const [r0, setR0] = useState(10000);
    const [activeId, setActiveId] = useState(() => window.location.hash.replace(/^#/, '') || 'opening_layoff');

    const policyItems = useMemo(buildPolicySidebarItems, []);
    const { chainGroups, single: singleItems, scripted: scriptedItems } = useMemo(buildRandomEventSidebarItems, []);
    const investorItem = useMemo(buildInvestorSidebarItem, []);
    const investorReviewItems = useMemo(buildInvestorReviewSidebarItems, []);
    const storyPreviewItems = useMemo(buildStoryPreviewSidebarItems, []);

    // 把所有 chainGroups 的事件平铺一份用于查找
    const chainItemsFlat = Object.values(chainGroups).flat();
    const allItems = [
      ...storyPreviewItems,
      ...policyItems,
      ...scriptedItems,
      ...chainItemsFlat,
      ...singleItems,
      ...investorReviewItems,
      investorItem,
    ];

    const activeItem = allItems.find((it) => it.id === activeId);

    let built = null;
    if (activeItem) {
      if (activeItem.kind === 'policy') {
        built = buildPolicyEventForStage(activeItem.policyEventId, activeItem.policyStage, r0);
      } else if (activeItem.kind === 'event') {
        built = buildRandomEventModal(activeItem.eventId);
      } else if (activeItem.kind === 'investor') {
        built = buildInvestorModal();
      } else if (activeItem.kind === 'investorReview') {
        built = buildInvestorReviewModal(activeItem.investorReviewStage);
      } else if (activeItem.kind === 'storyPreview') {
        built = buildStoryPreviewModal(activeItem.storyId);
      }
    }

    function selectItem(id) {
      setActiveId(id);
      window.location.hash = id;
    }

    function renderSidebarGroup(title, items) {
      return (
        <div className="sb-group">
          <div className="sb-group-title">{title}</div>
          {items.map((it) => (
            <button
              key={it.id}
              className={`sb-item ${activeId === it.id ? 'active' : ''}`}
              onClick={() => selectItem(it.id)}
            >
              {it.title}
              {it.stageTag && <span className="stage-tag">{it.stageTag}</span>}
            </button>
          ))}
        </div>
      );
    }

    return (
      <>
        <div className="sb-sidebar">
          <div className="sb-sidebar-header">
            <h1>事件弹窗预览</h1>
            <div className="sub">实时读取 wycwy-data.js · {allItems.length} 项</div>
          </div>
          <div className="sb-controls">
            R₀ 锁定基准(罚款/贷款)
            <input
              type="number"
              value={r0}
              onChange={(e) => setR0(parseInt(e.target.value, 10) || 0)}
            />
          </div>
          {renderSidebarGroup('剧情预览', storyPreviewItems)}
          {renderSidebarGroup('政策事件 (V15)', policyItems)}
          {scriptedItems.length > 0 && renderSidebarGroup('脚本事件', scriptedItems)}
          {CHAIN_GROUP_ORDER.map((group) => (
            chainGroups[group]
              ? <React.Fragment key={group}>{renderSidebarGroup(CHAIN_GROUP_LABELS[group] || `链式 · ${group}`, chainGroups[group])}</React.Fragment>
              : null
          ))}
          {renderSidebarGroup('随机事件 - 阶段池', singleItems)}
          {renderSidebarGroup('投资人 review', investorReviewItems)}
          {renderSidebarGroup('投资人危机', [investorItem])}
        </div>

        <div className="sb-stage">
          {activeItem && activeItem.kind === 'event' && (() => {
            const ev = D.EVENTS.find(e => e.id === activeItem.eventId);
            if (!ev) return null;
            return (
              <div className="sb-meta-banner">
                <span><b>id</b><code>{ev.id}</code></span>
                <span><b>type</b><code>{ev.eventType || 'random'}</code></span>
                {ev.phase && <span><b>阶段池</b><code>{PHASE_LABELS[ev.phase] || ev.phase}</code></span>}
                {ev.minDay !== undefined && <span><b>最早触发</b><code>D{ev.minDay}</code></span>}
                {ev.minCrews !== undefined && <span><b>最少车组</b><code>{ev.minCrews}</code></span>}
                {ev.minOrders !== undefined && <span><b>最少订单</b><code>{ev.minOrders}</code></span>}
                {ev.weight !== undefined && <span><b>抽签权重</b><code>{ev.weight}</code></span>}
                {ev.chainId && <span><b>chainId</b><code>{ev.chainId}</code></span>}
                {ev.stage && <span><b>链段</b><code>S{ev.stage}</code></span>}
                {ev.delayAfter && <span><b>前段后</b><code>{ev.delayAfter}天</code></span>}
                <span><b>旧任务参考</b><code>M{ev.unlockMission || 0}</code></span>
                {ev.chain && <span><b>chain</b><code>{ev.chain}</code></span>}
                {ev.requireChainChoice && (
                  <span><b>requireChainChoice</b><code>{JSON.stringify(ev.requireChainChoice)}</code></span>
                )}
                {ev.requireKeyDriverAlive !== undefined && (
                  <span><b>requireKeyDriverAlive</b><code>{String(ev.requireKeyDriverAlive)}</code></span>
                )}
                {ev.cooldown && <span><b>cooldown</b><code>{ev.cooldown}天</code></span>}
              </div>
            );
          })()}
          {!built && <div className="sb-stage-empty">请从左侧选一个事件预览</div>}
          {built && built.type === 'policyDecision' && (
            <PreviewPolicyDecisionModal
              key={`pd_${activeId}_${r0}`}
              decision={built.decision}
              state={MOCK_STATE}
              onResolve={(c, t) => console.log('选了', c, t)}
            />
          )}
          {built && built.type === 'policyNotice' && (
            <PreviewPolicyNoticeModal
              key={`pn_${activeId}_${r0}`}
              event={built.event}
              state={MOCK_STATE}
              onResolve={(idx) => console.log('点击关闭', idx)}
            />
          )}
          {built && built.type === 'event' && (
            <PreviewEventModal
              key={`ev_${activeId}`}
              event={built.event}
              state={built.event.id === 'snow_night_breakthrough' ? SNOW_RESCUE_MOCK_STATE : MOCK_STATE}
              onResolve={(idx) => console.log('选项', idx)}
              onResolveInvestor={() => {}}
            />
          )}
          {built && built.type === 'investor' && (
            <PreviewEventModal
              key={`inv_${activeId}`}
              event={built.event}
              state={INVESTOR_MOCK_STATE}
              onResolve={() => {}}
              onResolveInvestor={(choices) => console.log('投资人决策', choices)}
            />
          )}
          {built && built.type === 'investorReview' && (
            <PreviewEventModal
              key={`review_${activeId}`}
              event={built.event}
              state={INVESTOR_REVIEW_MOCK_STATE}
              onResolve={(idx) => console.log('投资人 review 选项', idx)}
              onResolveInvestor={() => {}}
            />
          )}
          {built && built.type === 'storyPreview' && (
            <PreviewStoryModal
              key={`story_${activeId}`}
              story={built.story}
            />
          )}
        </div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<StorybookApp />);
</script>
</body>
</html>
