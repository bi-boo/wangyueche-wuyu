<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>事件弹窗预览(实时数据 Storybook)</title>
<!-- 预览页直接读取当前 data / engine / JSX,每次刷新都用新查询参数绕开本地缓存 -->
<script>
  window.WYCWY_PREVIEW_VERSION = new URLSearchParams(window.location.search).get('_t') || String(Date.now());
  [
    'src/styles/00-tokens.css',
    'src/styles/10-base.css',
    'src/styles/20-topbar.css',
    'src/styles/30-modals.css',
    'src/styles/40-tasks-list.css',
    'src/styles/50-feedback.css',
    'src/styles/60-inspector.css',
    'src/styles/70-pixel-flytext.css',
    'src/styles/80-map-hud.css',
    'src/styles/90-toggles-recruit.css',
    'src/styles/99-overrides.css',
  ].forEach((href) => {
    document.write('<link rel="stylesheet" href="' + href + '?v=' + window.WYCWY_PREVIEW_VERSION + '">');
  });
</script>
<style>
  html, body { height: 100%; margin: 0; padding: 0; background: #f3eedb; }
  #root { height: 100vh; display: flex; flex-direction: row; overflow: hidden; }

  /* 左侧栏 */
  .sb-sidebar {
    width: 300px; flex-shrink: 0;
    background: #1d1a18; color: #ddd;
    overflow-y: auto;
    z-index: 100;
    box-shadow: 2px 0 12px rgba(0,0,0,0.2);
  }
  .sb-sidebar-header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky; top: 0;
    background: #1d1a18;
    z-index: 1;
  }
  .sb-sidebar-header h1 { font-size: 14px; margin: 0 0 4px; color: #ffb74d; font-weight: 600; }
  .sb-sidebar-header .sub { font-size: 11px; color: #999; }
  .sb-controls {
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 12px; color: #bbb;
  }
  .sb-controls input {
    width: 100%; padding: 4px 8px; margin-top: 4px;
    border-radius: 3px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: #fff; font-family: inherit;
    font-size: 12px;
  }
  .sb-group { padding: 12px 0 6px; }
  .sb-group-title {
    padding: 4px 16px; font-size: 11px; font-weight: 600;
    color: #ff6b35; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .sb-item {
    display: block; width: 100%;
    padding: 7px 16px 7px 24px;
    background: transparent; border: none;
    color: #ccc; font-size: 12px; text-align: left;
    cursor: pointer;
    font-family: inherit;
    border-left: 3px solid transparent;
    line-height: 1.45;
  }
  .sb-item:hover { background: rgba(255,255,255,0.04); color: #fff; }
  .sb-item.active {
    background: rgba(255,107,53,0.18);
    color: #fff;
    border-left-color: #ff6b35;
    font-weight: 500;
  }
  .sb-item .stage-tag {
    display: inline-block;
    padding: 1px 6px; margin-left: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    font-size: 10px; color: #aaa;
  }
  .sb-item.active .stage-tag {
    background: rgba(255,255,255,0.18); color: #fff;
  }

  /* 主区 - modal 限制在这里显示 */
  .sb-stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #f3eedb;
  }
  .sb-stage-empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #888; font-size: 14px;
  }
  /* 关键:让 modal-overlay 在 storybook 里限制在主区 */
  .sb-stage .modal-overlay {
    position: absolute !important;
    inset: 0;
    z-index: 50;
    padding-top: 56px !important;
  }
  .sb-meta-banner {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 200;
    background: #1d1a18;
    color: #ffb74d;
    padding: 10px 16px;
    font-size: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .sb-meta-banner b { color: #888; font-weight: 500; margin-right: 4px; }
  .sb-meta-banner code {
    color: #fff;
    background: rgba(255,255,255,0.08);
    padding: 1px 6px;
    border-radius: 2px;
    font-family: "JetBrains Mono", "Menlo", monospace;
    font-size: 11px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script>
  ['wycwy-data.js', 'wycwy-engine.js'].forEach((src) => {
    document.write('<script src="' + src + '?v=' + window.WYCWY_PREVIEW_VERSION + '"><\/script>');
  });
  [
    'src/app/00-runtime.jsx',
    'src/app/10-icons.jsx',
    'src/app/20-topbar.jsx',
    'src/app/30-fleet.jsx',
    'src/app/40-inspector.jsx',
    'src/app/50-modals.jsx',
  ].forEach((src) => {
    document.write('<script type="text/babel" src="' + src + '?v=' + window.WYCWY_PREVIEW_VERSION + '"><\/script>');
  });
</script>

<script type="text/babel">
  const { useState, useMemo } = React;

  // 组件未加载时的明确提示(替代空白)
  function ComponentMissingError({ name }) {
    return (
      <div style={{
        position: 'absolute', inset: 0,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: 40,
      }}>
        <div style={{
          maxWidth: 520, padding: 24,
          background: '#fff3cd', border: '2px solid #ffc107', borderRadius: 8,
          color: '#664d03', fontSize: 14, lineHeight: 1.6,
        }}>
          <div style={{fontSize: 16, fontWeight: 600, marginBottom: 12}}>⚠ 组件 <code>{name}</code> 未定义</div>
          <div>这通常是浏览器缓存了旧版 <code>50-modals.jsx</code> 导致的。请按以下方式强制刷新:</div>
          <ul style={{marginTop: 8, paddingLeft: 20}}>
            <li><b>Mac Chrome / Safari</b>:右键页面"刷新"按钮 → 选"清空缓存并硬性重新加载"</li>
            <li><b>快捷键</b>:Cmd + Shift + R(或 Cmd + Option + E 清缓存后再刷)</li>
            <li><b>实在不行</b>:开 DevTools(F12) → Network → 勾选 "Disable cache" → 刷新</li>
          </ul>
        </div>
      </div>
    );
  }

  // -------- 数据准备 --------
  const D = window.WYCWY_DATA;
  const E = window.WYCWY_ENGINE;

  // 政策事件:每个 stage 一个左侧栏项
  function buildPolicySidebarItems() {
    const out = [];
    (D.POLICY_EVENTS || []).forEach((ev) => {
      const stages = ev.stages || {};
      Object.keys(stages).forEach((stageKey) => {
        out.push({
          id: `policy_${ev.id}_${stageKey}`,
          title: stages[stageKey].title,
          stageTag: stageKeyToShortLabel(ev, stageKey),
          kind: 'policy',
          policyEventId: ev.id,
          policyStage: stageKey,
        });
      });
    });
    return out;
  }
  function stageKeyToShortLabel(ev, stageKey) {
    if (ev.id !== 'gov_ban') return stageKey;
    const map = {
      notice_1: 'Day 30',
      decision: 'Day 60 决策',
      verdict_pass: 'Day 90 通过',
      verdict_fine: 'Day 90 轻罚',
      verdict_ban: 'Day 90 整改',
      resume: 'Day 150 解禁',
    };
    return map[stageKey] || stageKey;
  }

  // V15.x:按 id 前缀分组 — 4 个真分支链式归"链式"组,其他归"单段"组
  const TRUE_CHAINS = ['borrow', 'platform', 'rival', 'accident'];
  function getChainGroup(eventId) {
    for (const chain of TRUE_CHAINS) {
      if (eventId === chain || eventId.startsWith(chain + '_')) return chain;
    }
    return null;
  }

  function buildRandomEventSidebarItems() {
    const allEvents = D.EVENTS || [];
    const chainGroups = {};   // { borrow: [...], platform: [...], rival: [...], accident: [...] }
    const single = [];
    const sortByMission = (a, b) => {
      const ea = allEvents.find(e => e.id === a.eventId);
      const eb = allEvents.find(e => e.id === b.eventId);
      return (ea.unlockMission || 0) - (eb.unlockMission || 0);
    };
    allEvents.forEach((ev) => {
      const baseItem = {
        id: `event_${ev.id}`,
        title: ev.title,
        stageTag: `m${ev.unlockMission || 0} · ${ev.tag}`,
        kind: 'event',
        eventId: ev.id,
      };
      const group = getChainGroup(ev.id);
      if (group) {
        if (!chainGroups[group]) chainGroups[group] = [];
        chainGroups[group].push(baseItem);
      } else {
        single.push(baseItem);
      }
    });
    Object.values(chainGroups).forEach(arr => arr.sort(sortByMission));
    single.sort(sortByMission);
    return { chainGroups, single };
  }

  function buildInvestorSidebarItem() {
    return {
      id: 'investor_pressure',
      title: '投资人压力',
      stageTag: '危机',
      kind: 'investor',
    };
  }

  const INVESTOR_REVIEW_STAGE_ORDER = ['q1', 'h1', 'q3_pass', 'q3_warn', 'q3_fired', 'y1'];
  const INVESTOR_REVIEW_STAGE_LABELS = {
    q1: 'Day 90',
    h1: 'Day 180',
    q3_pass: 'Day 270 达标',
    q3_warn: 'Day 270 警告',
    q3_fired: 'Day 270 撤资',
    y1: 'Day 360',
  };

  function buildInvestorReviewSidebarItems() {
    const stages = D.INVESTOR_REVIEW?.stages || {};
    return INVESTOR_REVIEW_STAGE_ORDER
      .filter((stageKey) => stages[stageKey])
      .map((stageKey) => ({
        id: `investor_review_${stageKey}`,
        title: stages[stageKey].title,
        stageTag: INVESTOR_REVIEW_STAGE_LABELS[stageKey] || stageKey,
        kind: 'investorReview',
        investorReviewStage: stageKey,
      }));
  }

  // -------- mock state --------
  const baseInitial = E.makeInitialState();
  const MOCK_STATE = {
    ...baseInitial,
    funds: 75695,
    reputation: 401,
    todayEarned: 144,
    day: 60,
    hour: 14,
  };
  // 投资人事件需要资金负 + 可裁的司机/可卖的车
  const INVESTOR_MOCK_STATE = {
    ...baseInitial,
    funds: -3500,
    reputation: 280,
    day: 50,
    hour: 6,
  };
  const INVESTOR_REVIEW_MOCK_STATE = {
    ...baseInitial,
    funds: 118000,
    reputation: 360,
    day: 270,
    hour: 9,
    drivers: baseInitial.drivers.map((driver, idx) => ({
      ...driver,
      vehicleId: baseInitial.vehicles[idx]?.id || driver.vehicleId,
    })),
  };

  // -------- render helpers --------
  function buildPolicyEventForStage(eventId, stageKey, r0) {
    const ev = D.POLICY_EVENTS.find((e) => e.id === eventId);
    if (!ev) return null;
    const stageData = ev.stages[stageKey];
    if (!stageData) return null;
    const params = ev.params;

    if (stageKey === 'decision') {
      return {
        type: 'policyDecision',
        decision: {
          eventId, stage: stageKey,
          title: stageData.title, tag: stageData.tag, desc: stageData.desc,
          options: stageData.options,
          refMonthlyRevenue: r0,
          params,
        },
      };
    }

    let previews = [];
    let footerNote = '';
    if (stageKey === 'verdict_fine') {
      previews = [
        { label: '象征性罚款', value: `-¥${Math.round(r0 * params.A_VERDICT_FINE_PCT).toLocaleString()}`, tone: 'negative' },
      ];
    } else if (stageKey === 'verdict_ban') {
      const schedule = params.COMPLIANCE_SCHEDULE_PCT || [0.25, 0.20, 0.15, 0.10];
      const firstPct = Math.round((schedule[0] || 0.25) * 100);
      const floorPct = Math.round((schedule[schedule.length - 1] || 0.10) * 100);
      previews = [
        { label: '立即罚款', value: `-¥${Math.round(r0 * params.B_FINE_PCT).toLocaleString()}`, tone: 'negative' },
        { label: '60 天禁运 · 订单量', value: `降至 ${Math.round(params.B_BAN_ORDER_BOOST * 100)}%(60 天)`, tone: 'negative' },
        { label: '强制启动月合规成本', value: `每月按流水扣:首月 ${firstPct}% → 稳定后 ${floorPct}%`, tone: 'negative' },
      ];
      footerNote = '整改期间运营成本需照常承担。如需止损,可在车队管理界面卖车或裁员。';
    } else if (stageKey === 'resume') {
      previews = [
        { label: '禁运解除 · 订单量', value: '恢复至 100%', tone: 'positive' },
      ];
    }

    return {
      type: 'policyNotice',
      event: {
        id: `policy_${eventId}_${stageKey}`,
        title: stageData.title, tag: stageData.tag, desc: stageData.desc,
        isPolicyEvent: true,
        policyEventId: eventId,
        policyStage: stageKey,
        policyEffectPreview: previews,
        policyFooterNote: footerNote,
        options: [{ label: stageData.buttonLabel || '知道了', detail: '', apply: () => ({}) }],
      },
    };
  }

  function buildRandomEventModal(eventId) {
    const ev = D.EVENTS.find((e) => e.id === eventId);
    if (!ev) return null;
    return { type: 'event', event: { ...ev } };
  }

  function buildInvestorModal() {
    return {
      type: 'investor',
      event: D.INVESTOR_PRESSURE,
    };
  }

  function buildInvestorReviewModal(stageKey) {
    const review = D.INVESTOR_REVIEW;
    const stageData = review?.stages?.[stageKey];
    if (!stageData) return null;
    const ctx = {
      fee: stageKey === 'h1' ? 25000 : stageKey === 'q3_warn' ? 35000 : stageKey === 'q3_fired' ? 177000 : 0,
      remaining: 59000,
      startFundsK: Math.round((D.GAME.STARTING_FUNDS || 0) / 1000),
      currentFundsK: Math.round((INVESTOR_REVIEW_MOCK_STATE.funds || 0) / 1000),
      startCrews: 2,
      currentCrews: INVESTOR_REVIEW_MOCK_STATE.drivers.filter((driver) => driver.vehicleId).length,
    };
    let desc = stageData.desc || '';
    desc = desc
      .replace(/\{N\}/g, ctx.fee.toLocaleString())
      .replace(/\{remaining\}/g, ctx.remaining.toLocaleString())
      .replace(/\{startFundsK\}/g, ctx.startFundsK)
      .replace(/\{currentFundsK\}/g, ctx.currentFundsK)
      .replace(/\{startCrews\}/g, ctx.startCrews)
      .replace(/\{currentCrews\}/g, ctx.currentCrews);
    const options = stageData.options
      ? stageData.options.map((opt) => ({ label: opt.label, detail: opt.detail, apply: () => ({}) }))
      : [{ label: stageData.buttonLabel || '知道了', detail: '', apply: () => ({}) }];
    return {
      type: 'investorReview',
      event: {
        id: `investor_review_${stageKey}`,
        title: stageData.title,
        tag: stageData.tag,
        desc,
        isInvestorReview: true,
        investorReviewStage: stageKey,
        investorReviewFee: ctx.fee,
        investorReviewFeeLabel: stageKey === 'h1' ? '中型公司的咨询费' : stageKey === 'q3_warn' ? '考核罚金(中车队)' : '',
        skipScale: true,
        options,
      },
    };
  }

  function StorybookApp() {
    const [r0, setR0] = useState(87684);
    const [activeId, setActiveId] = useState(() => window.location.hash.replace(/^#/, '') || 'policy_gov_ban_decision');

    const policyItems = useMemo(buildPolicySidebarItems, []);
    const { chainGroups, single: singleItems } = useMemo(buildRandomEventSidebarItems, []);
    const investorItem = useMemo(buildInvestorSidebarItem, []);
    const investorReviewItems = useMemo(buildInvestorReviewSidebarItems, []);

    // 把所有 chainGroups 的事件平铺一份用于查找
    const chainItemsFlat = Object.values(chainGroups).flat();
    const allItems = [
      ...policyItems,
      ...chainItemsFlat,
      ...singleItems,
      ...investorReviewItems,
      investorItem,
    ];

    const activeItem = allItems.find((it) => it.id === activeId);

    let built = null;
    if (activeItem) {
      if (activeItem.kind === 'policy') {
        built = buildPolicyEventForStage(activeItem.policyEventId, activeItem.policyStage, r0);
      } else if (activeItem.kind === 'event') {
        built = buildRandomEventModal(activeItem.eventId);
      } else if (activeItem.kind === 'investor') {
        built = buildInvestorModal();
      } else if (activeItem.kind === 'investorReview') {
        built = buildInvestorReviewModal(activeItem.investorReviewStage);
      }
    }

    function renderSidebarGroup(title, items) {
      return (
        <div className="sb-group">
          <div className="sb-group-title">{title}</div>
          {items.map((it) => (
            <button
              key={it.id}
              className={`sb-item ${activeId === it.id ? 'active' : ''}`}
              onClick={() => setActiveId(it.id)}
            >
              {it.title}
              {it.stageTag && <span className="stage-tag">{it.stageTag}</span>}
            </button>
          ))}
        </div>
      );
    }

    return (
      <>
        <div className="sb-sidebar">
          <div className="sb-sidebar-header">
            <h1>事件弹窗预览</h1>
            <div className="sub">实时读取 wycwy-data.js · {allItems.length} 项</div>
          </div>
          <div className="sb-controls">
            R₀ 基准月营收(¥)
            <input
              type="number"
              value={r0}
              onChange={(e) => setR0(parseInt(e.target.value, 10) || 0)}
            />
          </div>
          {renderSidebarGroup('政策事件 (V15)', policyItems)}
          {chainGroups.borrow && renderSidebarGroup('链式 · borrow 老张借钱', chainGroups.borrow)}
          {chainGroups.platform && renderSidebarGroup('链式 · platform 平台抽成', chainGroups.platform)}
          {chainGroups.rival && renderSidebarGroup('链式 · rival 竞品挖人(钥匙司机)', chainGroups.rival)}
          {chainGroups.accident && renderSidebarGroup('链式 · accident 司机事故', chainGroups.accident)}
          {renderSidebarGroup('随机事件 - 单段', singleItems)}
          {renderSidebarGroup('投资人 review', investorReviewItems)}
          {renderSidebarGroup('投资人危机', [investorItem])}
        </div>

        <div className="sb-stage">
          {activeItem && activeItem.kind === 'event' && (() => {
            const ev = D.EVENTS.find(e => e.id === activeItem.eventId);
            if (!ev) return null;
            return (
              <div className="sb-meta-banner">
                <span><b>id</b><code>{ev.id}</code></span>
                <span><b>unlockMission</b><code>{ev.unlockMission || 0}</code></span>
                {ev.chain && <span><b>chain</b><code>{ev.chain}</code></span>}
                {ev.requireChainChoice && (
                  <span><b>requireChainChoice</b><code>{JSON.stringify(ev.requireChainChoice)}</code></span>
                )}
                {ev.requireKeyDriverAlive !== undefined && (
                  <span><b>requireKeyDriverAlive</b><code>{String(ev.requireKeyDriverAlive)}</code></span>
                )}
                {ev.cooldown && <span><b>cooldown</b><code>{ev.cooldown}天</code></span>}
              </div>
            );
          })()}
          {!built && <div className="sb-stage-empty">请从左侧选一个事件预览</div>}
          {built && built.type === 'policyDecision' && (
            typeof PolicyDecisionModal === 'function' ? (
              <PolicyDecisionModal
                key={`pd_${activeId}_${r0}`}
                decision={built.decision}
                state={MOCK_STATE}
                onResolve={(c, t) => console.log('选了', c, t)}
              />
            ) : (
              <ComponentMissingError name="PolicyDecisionModal" />
            )
          )}
          {built && built.type === 'policyNotice' && (
            typeof PolicyNoticeModal === 'function' ? (
              <PolicyNoticeModal
                key={`pn_${activeId}_${r0}`}
                event={built.event}
                state={MOCK_STATE}
                onResolve={(idx) => console.log('点击关闭', idx)}
              />
            ) : (
              <ComponentMissingError name="PolicyNoticeModal" />
            )
          )}
          {built && built.type === 'event' && (
            <EventModal
              key={`ev_${activeId}`}
              event={built.event}
              state={MOCK_STATE}
              onResolve={(idx) => console.log('选项', idx)}
              onResolveInvestor={() => {}}
            />
          )}
          {built && built.type === 'investor' && (
            <EventModal
              key={`inv_${activeId}`}
              event={built.event}
              state={INVESTOR_MOCK_STATE}
              onResolve={() => {}}
              onResolveInvestor={(choices) => console.log('投资人决策', choices)}
            />
          )}
          {built && built.type === 'investorReview' && (
            <EventModal
              key={`review_${activeId}`}
              event={built.event}
              state={INVESTOR_REVIEW_MOCK_STATE}
              onResolve={(idx) => console.log('投资人 review 选项', idx)}
              onResolveInvestor={() => {}}
            />
          )}
        </div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<StorybookApp />);
</script>
</body>
</html>
