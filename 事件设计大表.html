<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>事件设计大表 · 实时版</title>
<style>
  :root {
    --bg: #F4E4BC;
    --card: #FFF8E7;
    --sub: #F0E2BC;
    --ink: #2A2320;
    --ink-2: #6D635A;
    --ink-3: #9A8C7E;
    --accent: #FF8C42;
    --accent-soft: #FFE0B8;
    --accent-deep: #D4621F;
    --green: #5FAD41;
    --green-soft: #D6EBC4;
    --warn: #E84545;
    --warn-soft: #FFD6D6;
    --blue-soft: #DCE8F5;
    --border: #2A2320;
    --border-soft: rgba(42,35,32,0.18);
    --hairline: rgba(42,35,32,0.10);
    --ui-radius: 2px;
    --shadow: 3px 3px 0 var(--border-soft), 0 8px 20px rgba(42,35,32,0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 24px 64px;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.55;
    background-image:
      repeating-linear-gradient(0deg, transparent 0, transparent 16px, rgba(42,35,32,0.025) 16px, rgba(42,35,32,0.025) 17px),
      repeating-linear-gradient(90deg, transparent 0, transparent 16px, rgba(42,35,32,0.025) 16px, rgba(42,35,32,0.025) 17px);
  }
  .container { max-width: 1480px; margin: 0 auto; }
  .top {
    position: sticky;
    top: 0;
    z-index: 10;
    margin: -24px -24px 20px;
    padding: 18px 24px 14px;
    background: color-mix(in srgb, var(--bg) 92%, white 8%);
    border-bottom: 2px solid var(--border-soft);
    backdrop-filter: blur(8px);
  }
  .top-inner { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
  h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.2; }
  .subtitle { color: var(--ink-2); font-size: 13px; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .search {
    width: 260px;
    padding: 8px 10px;
    border: 2px solid var(--border);
    border-radius: var(--ui-radius);
    background: var(--card);
    color: var(--ink);
    font: inherit;
  }
  button {
    padding: 8px 12px;
    border: 2px solid var(--border);
    border-radius: var(--ui-radius);
    background: var(--accent);
    color: var(--ink);
    font-weight: 800;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--border);
  }
  .summary {
    display: grid;
    grid-template-columns: repeat(6, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }
  .metric {
    background: var(--card);
    border: 1.5px solid var(--border-soft);
    border-radius: var(--ui-radius);
    box-shadow: var(--shadow);
    padding: 12px 14px;
  }
  .metric span { display: block; color: var(--ink-3); font-size: 12px; }
  .metric strong { display: block; font-size: 24px; line-height: 1.2; margin-top: 3px; }
  h2 {
    margin: 30px 0 12px;
    padding-left: 12px;
    border-left: 4px solid var(--accent);
    font-size: 20px;
  }
  .note {
    margin: 0 0 16px;
    padding: 12px 14px;
    background: var(--accent-soft);
    border-left: 4px solid var(--accent);
    border-radius: var(--ui-radius);
    color: var(--ink-2);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    box-shadow: var(--shadow);
    border-radius: var(--ui-radius);
    overflow: hidden;
    margin-bottom: 20px;
  }
  thead { background: var(--ink); color: var(--card); }
  th {
    padding: 10px 9px;
    text-align: left;
    font-size: 12px;
    white-space: nowrap;
  }
  td {
    padding: 9px;
    vertical-align: top;
    border-bottom: 1px solid var(--hairline);
    font-size: 13px;
  }
  tbody tr:nth-child(even) { background: var(--sub); }
  tbody tr:hover { background: var(--accent-soft); }
  code {
    font-family: "JetBrains Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--accent-deep);
    background: rgba(255,255,255,0.58);
    padding: 1px 4px;
    border-radius: var(--ui-radius);
  }
  .id { white-space: nowrap; }
  .muted { color: var(--ink-3); }
  .tag {
    display: inline-block;
    padding: 1px 6px;
    border-radius: var(--ui-radius);
    background: var(--blue-soft);
    color: #2C5A8E;
    border: 1px solid rgba(44,90,142,0.22);
    font-weight: 800;
    font-size: 11px;
    white-space: nowrap;
  }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.good { background: var(--green-soft); color: var(--green); }
  .tag.neutral { background: var(--sub); color: var(--ink-2); }
  .options { display: grid; gap: 5px; }
  .option {
    padding: 6px 8px;
    border-left: 3px solid var(--accent);
    background: rgba(255,255,255,0.48);
  }
  .option b { color: var(--ink); }
  .small { font-size: 12px; color: var(--ink-2); }
  .empty {
    padding: 30px;
    background: var(--card);
    box-shadow: var(--shadow);
    color: var(--ink-3);
    text-align: center;
  }
  @media (max-width: 980px) {
    body { padding: 16px; }
    .top { margin: -16px -16px 16px; padding: 16px; }
    .top-inner { grid-template-columns: 1fr; }
    .summary { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
    .actions { align-items: stretch; }
    .search { width: 100%; }
  }
</style>
<script>
  window.WYCWY_PREVIEW_VERSION = new URLSearchParams(window.location.search).get('_t') || String(Date.now());
  document.write('<script src="./wycwy-data.js?v=' + window.WYCWY_PREVIEW_VERSION + '"><\/script>');
</script>
</head>
<body>
<div class="top">
  <div class="top-inner">
    <div>
      <h1>事件设计大表 · 实时版</h1>
      <div class="subtitle">直接读取当前 <code>wycwy-data.js</code>。游戏事件数据改了,刷新本页就是最新表。</div>
    </div>
    <div class="actions">
      <input id="search" class="search" placeholder="搜索 id / 标题 / tag / 文案" />
      <button id="reloadBtn" type="button">刷新数据</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="summary" class="summary"></div>
  <div id="content"></div>
</div>

<script>
(function () {
  const D = window.WYCWY_DATA || {};
  const content = document.getElementById('content');
  const summary = document.getElementById('summary');
  const searchInput = document.getElementById('search');
  const reloadBtn = document.getElementById('reloadBtn');

  const TRUE_CHAINS = ['borrow', 'platform', 'rival', 'accident'];
  const CHAIN_NAMES = {
    borrow: '老张借钱',
    platform: '平台抽成',
    rival: '竞品挖人',
    accident: '司机事故',
  };

  function esc(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function money(value) {
    const num = Number(value || 0);
    return '¥' + Math.round(num).toLocaleString();
  }

  function code(value) {
    if (value === undefined || value === null || value === '') return '<span class="muted">-</span>';
    return '<code>' + esc(value) + '</code>';
  }

  function getChainFamily(event) {
    const id = event.id || '';
    for (const family of TRUE_CHAINS) {
      if (id === family || id.startsWith(family + '_') || event.chain === family || (event.chain || '').startsWith(family + '_')) {
        return family;
      }
    }
    return '';
  }

  function formatRequire(value) {
    if (!value) return '';
    return Object.entries(value).map(([key, val]) => {
      const shown = Array.isArray(val) ? '[' + val.join(', ') + ']' : val;
      return key + ' = ' + shown;
    }).join('; ');
  }

  function triggerText(event) {
    const parts = ['完成任务数 ≥ ' + (event.unlockMission || 0)];
    const req = formatRequire(event.requireChainChoice);
    if (req) parts.push('前置选择: ' + req);
    if (event.requireKeyDriverAlive === true) parts.push('钥匙司机在编');
    if (event.requireKeyDriverAlive === false) parts.push('钥匙司机已离队');
    if (event.requireFunds) parts.push('资金 ≥ ' + money(event.requireFunds));
    if (event.blindOptions) parts.push('盲选:选前隐藏后果');
    if (event.skipScale) parts.push('不按规模缩放');
    return parts.join('<br>');
  }

  function optionText(options) {
    if (!Array.isArray(options) || options.length === 0) return '<span class="muted">无选项</span>';
    return '<div class="options">' + options.map((opt, idx) => {
      const choice = opt.choiceKey !== undefined ? ' <span class="small">choiceKey=' + esc(JSON.stringify(opt.choiceKey)) + '</span>' : '';
      const detail = opt.detail ? '<div class="small">' + esc(opt.detail) + '</div>' : '';
      return '<div class="option"><b>' + (idx + 1) + '. ' + esc(opt.label || '选项') + '</b>' + choice + detail + '</div>';
    }).join('') + '</div>';
  }

  function searchTextEvent(event) {
    return [
      event.id, event.title, event.tag, event.desc, event.chain,
      formatRequire(event.requireChainChoice),
      ...(event.options || []).flatMap((opt) => [opt.label, opt.detail]),
    ].join(' ').toLowerCase();
  }

  function rowEvent(event, idx) {
    const family = getChainFamily(event);
    return '<tr data-search="' + esc(searchTextEvent(event)) + '">' +
      '<td class="muted">' + (idx + 1) + '</td>' +
      '<td class="id">' + code(event.id) + '</td>' +
      '<td><b>' + esc(event.title) + '</b><div class="small">' + esc(event.desc || '') + '</div></td>' +
      '<td><span class="tag">' + esc(event.tag || '-') + '</span></td>' +
      '<td>' + (event.unlockMission || 0) + '</td>' +
      '<td>' + (family ? '<span class="tag good">' + esc(CHAIN_NAMES[family] || family) + '</span><br>' : '') + code(event.chain) + '</td>' +
      '<td>' + triggerText(event) + '<div class="small">冷却 ' + (event.cooldown || '-') + ' 天</div></td>' +
      '<td>' + optionText(event.options) + '</td>' +
    '</tr>';
  }

  function renderEventTable(title, note, events) {
    const rows = events
      .slice()
      .sort((a, b) => (a.unlockMission || 0) - (b.unlockMission || 0) || String(a.id).localeCompare(String(b.id)))
      .map(rowEvent)
      .join('');
    return '<h2>' + esc(title) + '</h2>' +
      (note ? '<div class="note">' + note + '</div>' : '') +
      '<table><thead><tr>' +
      '<th>#</th><th style="width:180px">事件 ID</th><th>标题与描述</th><th>标签</th><th>任务</th><th>链路</th><th>触发逻辑</th><th>选项与效果</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function renderPolicyTable() {
    const rows = (D.POLICY_EVENTS || []).flatMap((eventDef) => {
      return (eventDef.schedule || []).map((item) => {
        const stage = item.type === 'verdict' ? 'verdict_pass / verdict_fine / verdict_ban' : item.stage;
        const stageData = eventDef.stages?.[item.stage] || {};
        return '<tr data-search="' + esc([eventDef.id, eventDef.title, item.stage, item.type, stageData.title, stageData.tag].join(' ').toLowerCase()) + '">' +
          '<td>' + item.atDay + '</td>' +
          '<td>' + code(eventDef.id) + '</td>' +
          '<td>' + code(stage) + '</td>' +
          '<td><span class="tag warn">' + esc(item.type) + '</span></td>' +
          '<td><b>' + esc(stageData.title || eventDef.title) + '</b><div class="small">' + esc(stageData.desc || '') + '</div></td>' +
          '<td>' + optionText(stageData.options || [{ label: stageData.buttonLabel || '知道了', detail: '' }]) + '</td>' +
        '</tr>';
      });
    }).join('');
    return '<h2>政策事件时间线</h2>' +
      '<div class="note">这部分来自 <code>POLICY_EVENTS</code>,按游戏绝对天数触发,独立于随机事件抽签。</div>' +
      '<table><thead><tr><th>Day</th><th>事件</th><th>阶段</th><th>类型</th><th>弹窗内容</th><th>选项</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function kpiText(kpi) {
    if (!kpi) return '<span class="muted">无硬 KPI</span>';
    const parts = [
      '资金 ≥ ' + money(kpi.funds),
      '口碑 ≥ ' + kpi.reputation,
      '车组 ≥ ' + kpi.crews,
    ];
    if (kpi.requireAirport) parts.push('需要专车车组');
    if (kpi.requireLuxury) parts.push('需要豪华车组');
    parts.push(kpi.threshold === 'two_of_three' ? '判定:车组必达 + 资金/口碑至少 1 项' : '判定:全部满足');
    return parts.join('<br>');
  }

  function renderInvestorReviewTable() {
    const review = D.INVESTOR_REVIEW || {};
    const stageRows = Object.entries(review.stages || {}).map(([stageKey, stage]) => {
      return '<tr data-search="' + esc(['investor_review', stageKey, stage.title, stage.tag, stage.desc].join(' ').toLowerCase()) + '">' +
        '<td>' + code(stageKey) + '</td>' +
        '<td><span class="tag">' + esc(stage.tag || '-') + '</span></td>' +
        '<td><b>' + esc(stage.title || '') + '</b><div class="small">' + esc(stage.desc || '') + '</div></td>' +
        '<td>' + optionText(stage.options || [{ label: stage.buttonLabel || '知道了', detail: '' }]) + '</td>' +
      '</tr>';
    }).join('');
    const scheduleRows = (review.schedule || []).map((item) => {
      return '<tr data-search="' + esc(['investor_review', item.stage, item.type].join(' ').toLowerCase()) + '">' +
        '<td>' + item.atDay + '</td>' +
        '<td>' + code(item.stage) + '</td>' +
        '<td><span class="tag warn">' + esc(item.type) + '</span></td>' +
        '<td>' + kpiText(review.kpi?.[item.stage]) + '</td>' +
      '</tr>';
    }).join('');
    return '<h2>投资人 Review</h2>' +
      '<div class="note">这部分来自 <code>INVESTOR_REVIEW</code>,按 Day 90 / 180 / 270 / 360 检查经营结果。弹窗预览页会把每个分支单独列出来。</div>' +
      '<table><thead><tr><th>Day</th><th>检查点</th><th>类型</th><th>KPI 逻辑</th></tr></thead><tbody>' + scheduleRows + '</tbody></table>' +
      '<table><thead><tr><th>Stage</th><th>Tag</th><th>弹窗文案</th><th>选项</th></tr></thead><tbody>' + stageRows + '</tbody></table>';
  }

  function renderMissionGateTable() {
    const missionRows = (D.MISSIONS || []).map((mission, idx) => {
      return '<tr data-search="' + esc([mission.id, mission.title, mission.desc, mission.hint].join(' ').toLowerCase()) + '">' +
        '<td>' + (idx + 1) + '</td>' +
        '<td>' + code(mission.id) + '</td>' +
        '<td><b>' + esc(mission.title) + '</b><div class="small">' + esc(mission.desc || '') + '</div></td>' +
        '<td>' + (mission.hidden ? '<span class="tag neutral">静默</span>' : '<span class="tag good">主线可见</span>') + '</td>' +
        '<td>' + money(mission.reward?.funds) + '<div class="small">' + esc(mission.reward?.message || '') + '</div></td>' +
      '</tr>';
    }).join('');
    const gateRows = (D.UI_GATES || []).map((gate) => {
      const trigger = gate.trigger ? gate.trigger.type + ' = ' + gate.trigger.value : '-';
      return '<tr data-search="' + esc([gate.id, gate.title, gate.desc, gate.hint, trigger].join(' ').toLowerCase()) + '">' +
        '<td>' + code(gate.id) + '</td>' +
        '<td><b>' + esc(gate.title) + '</b><div class="small">' + esc(gate.desc || '') + '</div></td>' +
        '<td>' + code(trigger) + '</td>' +
        '<td>' + esc(gate.hint || '') + '</td>' +
      '</tr>';
    }).join('');
    return '<h2>任务与渐进解锁</h2>' +
      '<div class="note">这张表用于看“什么时候会开放什么 UI”。主线任务来自 <code>MISSIONS</code>,入口解锁来自 <code>UI_GATES</code>。</div>' +
      '<table><thead><tr><th>#</th><th>任务 ID</th><th>任务</th><th>展示</th><th>奖励</th></tr></thead><tbody>' + missionRows + '</tbody></table>' +
      '<table><thead><tr><th>Gate ID</th><th>解锁内容</th><th>触发</th><th>位置</th></tr></thead><tbody>' + gateRows + '</tbody></table>';
  }

  function renderSummary() {
    const events = D.EVENTS || [];
    const chainEvents = events.filter(getChainFamily).length;
    const visibleMissions = (D.MISSIONS || []).filter((mission) => !mission.hidden).length;
    const hiddenMissions = (D.MISSIONS || []).filter((mission) => mission.hidden).length;
    const metrics = [
      ['随机事件', events.length],
      ['链式事件段', chainEvents],
      ['政策事件', (D.POLICY_EVENTS || []).length],
      ['投资人阶段', Object.keys(D.INVESTOR_REVIEW?.stages || {}).length],
      ['主线任务', visibleMissions + ' + ' + hiddenMissions + ' 静默'],
      ['UI 解锁', (D.UI_GATES || []).length],
    ];
    summary.innerHTML = metrics.map(([label, value]) => '<div class="metric"><span>' + esc(label) + '</span><strong>' + esc(value) + '</strong></div>').join('');
  }

  function render() {
    const events = D.EVENTS || [];
    const chainBuckets = {};
    const singleEvents = [];
    events.forEach((event) => {
      const family = getChainFamily(event);
      if (family) {
        if (!chainBuckets[family]) chainBuckets[family] = [];
        chainBuckets[family].push(event);
      } else {
        singleEvents.push(event);
      }
    });

    renderSummary();
    let html = '';
    html += renderEventTable('随机事件 · 单段', '来自 <code>EVENTS</code> 中未归入四条真分支链式的事件。触发仍走每 7 天抽签、unlockMission 和冷却过滤。', singleEvents);
    TRUE_CHAINS.forEach((family) => {
      html += renderEventTable('链式事件 · ' + (CHAIN_NAMES[family] || family), '同一链路下的后续段靠 <code>chainChoices</code>、钥匙司机状态等条件过滤,不是旧版 chainStages 顺序推进。', chainBuckets[family] || []);
    });
    html += renderPolicyTable();
    html += renderInvestorReviewTable();
    html += renderMissionGateTable();
    content.innerHTML = html || '<div class="empty">没有读取到事件数据</div>';
    applyFilter();
  }

  function applyFilter() {
    const q = (searchInput.value || '').trim().toLowerCase();
    document.querySelectorAll('tbody tr[data-search]').forEach((row) => {
      row.style.display = !q || row.dataset.search.includes(q) ? '' : 'none';
    });
  }

  searchInput.addEventListener('input', applyFilter);
  reloadBtn.addEventListener('click', () => {
    const url = new URL(window.location.href);
    url.searchParams.set('_t', Date.now());
    window.location.href = url.toString();
  });

  render();
})();
</script>
</body>
</html>
