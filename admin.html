<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>网约车物语 — 数值调参后台</title>
<style>
  :root {
    --bg: #F5F1EA;
    --card: #FFFFFF;
    --sub: #F4EFE5;
    --ink: #2A2320;
    --ink-2: #6D635A;
    --ink-3: #9A8C7E;
    --accent: #FF8C42;
    --accent-deep: #D4621F;
    --green: #5FAD41;
    --gold: #FFD93D;
    --border: rgba(42,35,32,0.12);
    --hairline: rgba(42,35,32,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", -apple-system, "Helvetica Neue", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea {
    font-family: inherit;
    font-size: 14px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    border-radius: 6px;
    outline: none;
    width: 100%;
  }
  input:focus, textarea:focus { background: #fff; box-shadow: 0 0 0 2px rgba(255,140,66,0.2); }
  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }

  .topbar {
    height: 56px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    flex-shrink: 0;
  }
  .topbar h1 {
    margin: 0;
    font-size: 18px;
  }
  .topbar .v {
    font-size: 14px;
    color: var(--ink-3);
    margin-left: 6px;
  }
  .sync-badge {
    background: var(--green);
    color: #fff;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
  }
  .sync-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-2);
    cursor: pointer;
    user-select: none;
  }
  .sync-toggle input {
    width: 14px;
    height: 14px;
    margin: 0;
  }
  .topbar-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  .btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    border-radius: 6px;
    font-size: 14px;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.04); }
  .btn:active { box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.gold { background: var(--gold); }

  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 0;
    overflow: hidden;
  }
  aside {
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 14px 0;
    overflow-y: auto;
  }
  .nav-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 18px;
    background: transparent;
    border: none;
    color: var(--ink);
    font-size: 14px;
    border-left: 4px solid transparent;
  }
  .nav-item:hover { background: var(--sub); }
  .nav-item.active {
    background: var(--gold);
    border-left-color: var(--accent);
    font-weight: 700;
  }
  .nav-divider {
    border-top: 1px dashed var(--hairline);
    margin: 8px 0;
  }
  .nav-label {
    padding: 6px 18px 4px;
    font-size: 14px;
    color: var(--ink-3);
    text-transform: uppercase;
  }

  main {
    overflow-y: auto;
    padding: 20px;
  }
  .panel-h {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.04);
    border-radius: 6px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  .panel-h h2 {
    margin: 0 0 6px;
    font-size: 18px;
  }
  .panel-h p {
    margin: 0;
    font-size: 14px;
    color: var(--ink-2);
    line-height: 1.6;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.04);
  }
  th {
    background: var(--ink);
    color: var(--gold);
    text-align: left;
    padding: 8px 10px;
    font-size: 14px;
    font-weight: 400;
    white-space: nowrap;
  }
  td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--hairline);
    vertical-align: top;
    font-size: 14px;
  }
  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) { background: var(--sub); }
  .obj-grid {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 10px 16px;
    align-items: center;
  }
  .obj-grid .label {
    font-size: 14px;
    color: var(--ink-2);
  }
  .col-narrow { width: 90px; }
  .col-medium { width: 140px; }
  .col-wide { width: 200px; }
  .ro {
    color: var(--ink-3);
    font-style: italic;
    font-size: 14px;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    background: var(--gold);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    margin-left: 6px;
  }
  .section-note {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .note-chip {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 3px 8px;
    border: 1px solid var(--hairline);
    background: var(--sub);
    color: var(--ink-2);
    border-radius: 6px;
    font-size: 12px;
  }
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
  }
  .overview-card {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    border-radius: 6px;
    padding: 12px;
    min-width: 0;
  }
  .overview-card h3 {
    margin: 0 0 8px;
    font-size: 15px;
  }
  .metric-row {
    display: grid;
    grid-template-columns: minmax(64px, 1fr) repeat(4, minmax(44px, 58px));
    gap: 6px;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid var(--hairline);
    font-size: 12px;
  }
  .metric-row:last-child { border-bottom: none; }
  .metric-row .head {
    color: var(--ink-3);
    font-weight: 700;
  }
  .metric-row strong { font-size: 13px; }
  .mini-action {
    margin-top: 10px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    background: var(--sub);
    color: var(--ink);
    border-radius: 6px;
    font-size: 12px;
  }
  @media (max-width: 760px) {
    .topbar {
      height: auto;
      min-height: 56px;
      flex-wrap: wrap;
      padding: 8px 10px;
      gap: 8px;
    }
    .topbar h1 { font-size: 15px; }
    .topbar-actions {
      margin-left: 0;
      width: 100%;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .btn {
      padding: 7px 10px;
      font-size: 12px;
      white-space: nowrap;
    }
    .layout {
      grid-template-columns: 150px minmax(0, 1fr);
    }
    .nav-item {
      padding: 9px 10px;
      font-size: 13px;
    }
    .nav-label {
      padding-left: 10px;
      padding-right: 10px;
      font-size: 12px;
    }
    main { padding: 10px; }
    .panel-h { padding: 12px; }
    .overview-grid { grid-template-columns: minmax(210px, 1fr); }
  }
  .toast {
    position: fixed;
    top: 70px;
    right: 20px;
    background: var(--green);
    color: #fff;
    padding: 12px 18px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.04);
    z-index: 100;
    animation: in 0.2s ease-out, out 0.3s ease-in 2s forwards;
  }
  @keyframes in { from { transform: translateX(110%); } to { transform: translateX(0); } }
  @keyframes out { to { transform: translateX(110%); opacity: 0; } }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(42,35,32,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .modal-c {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 20px;
    max-width: 600px;
    width: calc(100vw - 40px);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }
  .modal-c textarea {
    flex: 1;
    min-height: 300px;
    font-family: monospace;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--border);
    padding: 10px;
    resize: vertical;
    line-height: 1.5;
  }
</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>

</head>

/* ========= 工具函数 ========= */

function deepClone(obj) {
  // 普通对象/数组深拷贝,函数保持引用
  if (obj === null || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(deepClone);
  const out = {};
  for (const k of Object.keys(obj)) out[k] = deepClone(obj[k]);
  return out;
}

function getNested(obj, path) {
  const parts = path.split('.');
  let cur = obj;
  for (const p of parts) {
    if (cur == null) return undefined;
    cur = cur[p];
  }
  return cur;
}

function setNested(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (cur[parts[i]] == null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  const leaf = parts[parts.length - 1];
  if (value === undefined && !Array.isArray(cur)) {
    delete cur[leaf];
  } else {
    cur[leaf] = value;
  }
}

/* ========= 自定义序列化(保留函数) ========= */

function jsLiteral(value, indent = 0) {
  const pad = '  '.repeat(indent);
  const pad2 = '  '.repeat(indent + 1);
  if (typeof value === 'function') {
    return value.toString();
  }
  if (value === null) return 'null';
  if (value === undefined) return 'undefined';
  if (typeof value === 'string') return JSON.stringify(value);
  if (typeof value === 'number' || typeof value === 'boolean') return String(value);
  if (Array.isArray(value)) {
    if (value.length === 0) return '[]';
    const items = value.map((v) => pad2 + jsLiteral(v, indent + 1));
    return '[\n' + items.join(',\n') + '\n' + pad + ']';
  }
  if (typeof value === 'object') {
    const keys = Object.keys(value);
    if (keys.length === 0) return '{}';
    const items = keys.map((k) => {
      const safeKey = /^[a-zA-Z_$][\w$]*$/.test(k) ? k : JSON.stringify(k);
      return pad2 + safeKey + ': ' + jsLiteral(value[k], indent + 1);
    });
    return '{\n' + items.join(',\n') + '\n' + pad + '}';
  }
  return 'undefined';
}

function exportDataJs(data) {
  // 生成 wycwy-data.js 全文
  // V14.9: 删除 RANKS / ACHIEVEMENTS(都已从 wycwy-data.js 移除)

    'GAME', 'BACKGROUNDS', 'VEHICLES', 'ORDERS', 'ZONES',
    'TRAININGS', 'EVENTS', 'INVESTOR_PRESSURE', 'POLICY_EVENTS', 'INVESTOR_REVIEW',
    'FIRST_NAMES', 'MISSIONS', 'ENDINGS',
    'RECRUIT_TICKETS', 'RARITY_META', 'RARITY_STAT_CAPS', 'RARITY_LOYALTY_RULES',
    'EVENT_NPCS', 'UI_GATES',
  ];
  let out = '/* 网约车物语 — 配置数据 (admin 后台导出) */\n';
  out += '(function () {\n';
  for (const name of exports) {
    if (data[name] === undefined) continue;
    out += `  const ${name} = ${jsLiteral(data[name], 1)};\n\n`;
  }
  out += '  window.WYCWY_DATA = {\n';
  out += '    ' + exports.filter((n) => data[n] !== undefined).join(', ') + '\n';
  out += '  };\n';
  out += '})();\n';
  return out;
}

function downloadFile(filename, content) {
  const blob = new Blob([content], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function CellEditor({ value, type, step, onChange, readonly }) {
  if (readonly) {
    return <span className="ro">{Array.isArray(value) ? value.join(',') : (value ?? '—')}</span>;
  }
  if (type === 'boolean') {
    return (
      <input
        type="checkbox"
        checked={!!value}
        onChange={(e) => onChange(e.target.checked)}
      />
    );
  }
  if (type === 'number') {
    return (
      <input
        type="number"
        step={step || 1}
        value={value ?? ''}
        onChange={(e) => onChange(e.target.value === '' ? undefined : Number(e.target.value))}
      />
    );
  }
  if (type === 'array') {
    return (
      <input
        value={Array.isArray(value) ? value.join(',') : ''}
        onChange={(e) => onChange(e.target.value.split(',').map((s) => s.trim()).filter(Boolean))}
        placeholder="逗号分隔"
      />
    );
  }
  return (
    <input
      value={value ?? ''}
      onChange={(e) => onChange(e.target.value)}
    />
  );
}

function avg(list, getter) {
  if (!list.length) return 0;
  return list.reduce((sum, item) => sum + getter(item), 0) / list.length;
}

function pct(value) {
  return `${Math.round((value || 0) * 100)}%`;
}

function ticketAtLeast(prob, draws = 3) {
  return 1 - Math.pow(1 - (prob || 0), draws);
}

function estimateTrainingCost(data, from, to, stat = 'driving') {
  const training = (data.TRAININGS || []).find((item) => item.stat === stat);
  if (!training || from >= to) return 0;
  const gain = Math.max(1, Math.round(((training.gainMin || 0) + (training.gainMax || 0)) / 2) || 10);
  let current = from;
  let cost = 0;
  let guard = 0;
  while (current < to && guard < 30) {
    const tier = (training.costTiers || []).find((item) => current <= item.max)
      || (training.costTiers || [])[training.costTiers.length - 1];
    cost += tier?.cost || training.cost || 0;
    current += gain;
    guard += 1;
  }
  return cost;
}

function money(value) {
  return `¥${Math.round(value || 0).toLocaleString()}`;
}

const SYNC_STORAGE_KEY = 'wycwy-config-override';
const SYNC_CHANNEL = 'wycwy-config';

// 把 data 中的函数字段去掉(localStorage 不能存函数)
function stripFunctions(obj) {
  if (obj === null || obj === undefined) return obj;
  if (typeof obj === 'function') return undefined;
  if (Array.isArray(obj)) return obj.map(stripFunctions).filter((x) => x !== undefined);
  if (typeof obj === 'object') {
    const out = {};
    for (const k of Object.keys(obj)) {
      const v = stripFunctions(obj[k]);
      if (v !== undefined) out[k] = v;
    }
    return out;
  }
  return obj;
}

// 把 localStorage 里的 override 合并到原始 D 之上(保留函数字段不被覆盖)
function hasFunctionDeep(value) {
  if (typeof value === 'function') return true;
  if (!value || typeof value !== 'object') return false;
  if (Array.isArray(value)) return value.some(hasFunctionDeep);
  return Object.keys(value).some((key) => hasFunctionDeep(value[key]));
}

function mergeConfigValue(orig, ov) {
  if (ov === undefined) return deepClone(orig);
  if (typeof orig === 'function') return orig;
  if (Array.isArray(orig) && Array.isArray(ov)) {
    const hasIdItems = ov.some((item) => item && typeof item === 'object' && item.id !== undefined);
    const origHasIdItems = orig.some((item) => item && typeof item === 'object' && item.id !== undefined);
    if (hasIdItems && origHasIdItems) {
      const next = orig.map(deepClone);
      ov.forEach((newItem) => {
        if (!newItem || typeof newItem !== 'object' || newItem.id === undefined) return;
        const idx = next.findIndex((x) => x && x.id === newItem.id);
        if (idx >= 0) next[idx] = mergeConfigValue(next[idx], newItem);
      });
      return next;
    }
    if (hasFunctionDeep(orig)) {
      return orig.map((item, idx) => mergeConfigValue(item, ov[idx]));
    }
    return deepClone(ov);
  }
  if (orig && ov && typeof orig === 'object' && typeof ov === 'object') {
    const next = deepClone(orig);
    Object.keys(ov).forEach((key) => {
      next[key] = mergeConfigValue(orig[key], ov[key]);
    });
    return next;
  }
  return deepClone(ov);
}

function normalizeOrderFares(data) {
  const minFares = data?.GAME?.MIN_ORDER_FARES || {};
  if (!Array.isArray(data?.ORDERS)) return data;
  return {
    ...data,
    ORDERS: data.ORDERS.map((order) => {
      const minFare = minFares[order.id];
      return minFare ? { ...order, fare: Math.max(order.fare || 0, minFare) } : order;
    }),
  };
}

function mergeOverride(base, override) {
  const out = deepClone(base);
  Object.keys(override).forEach((key) => {
    if (out[key] === undefined) return;
    out[key] = mergeConfigValue(out[key], override[key]);
  });
  return normalizeOrderFares(out);
}

/* ========= 主组件 ========= */

function App() {
  // 启动时合并 localStorage 覆盖
  const [data, setData] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(SYNC_STORAGE_KEY) || 'null');
      return saved ? mergeOverride(D, saved) : deepClone(D);
    } catch (e) {
      return deepClone(D);
    }
  });
  const [sectionId, setSectionId] = useState('BALANCE_OVERVIEW');
  const [toast, setToast] = useState(null);
  const [showExport, setShowExport] = useState(false);
  const [syncEnabled, setSyncEnabled] = useState(true);
  const [hasOverride, setHasOverride] = useState(() => !!localStorage.getItem(SYNC_STORAGE_KEY));

  const channelRef = React.useRef(null);
  if (!channelRef.current) channelRef.current = new BroadcastChannel(SYNC_CHANNEL);

  const section = SECTIONS.find((s) => s.id === sectionId);

  const groups = useMemo(() => {
    const g = {};
    for (const s of SECTIONS) {
      if (!g[s.group]) g[s.group] = [];
      g[s.group].push(s);
    }
    return g;
  }, []);

  const updateSection = (newVal) => {
    const newData = { ...data, [sectionId]: newVal };
    setData(newData);
    // 实时同步:写 localStorage + 广播
    if (syncEnabled) {
      try {
        const safe = stripFunctions(newData);
        localStorage.setItem(SYNC_STORAGE_KEY, JSON.stringify(safe));
        setHasOverride(true);
        channelRef.current.postMessage({ type: 'config-update', timestamp: Date.now() });
      } catch (e) { console.error('sync failed', e); }
    }
  };

  const handleExport = () => {
    const text = exportDataJs(data);
    downloadFile('wycwy-data.js', text);
    showToast('wycwy-data.js 已下载,可作永久保存');
  };

  const handleCopy = () => {
    const text = exportDataJs(data);
    setShowExport(true);
    setTimeout(() => navigator.clipboard?.writeText(text), 100);
  };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2300);
  };

  const handleReset = () => {
    if (confirm('丢弃当前所有改动,重置为 wycwy-data.js 当前值?')) {
      setData(deepClone(D));
      localStorage.removeItem(SYNC_STORAGE_KEY);
      setHasOverride(false);
      channelRef.current.postMessage({ type: 'config-update', timestamp: Date.now() });
      showToast('已清除覆盖,游戏会同步收到通知');
    }
  };

  return (
    <>
      <div className="topbar">
        <h1>网约车物语 <span className="v">数值后台</span></h1>
        {hasOverride && <span className="sync-badge">已生效覆盖</span>}
        <label className="sync-toggle">
          <input type="checkbox" checked={syncEnabled} onChange={(e) => setSyncEnabled(e.target.checked)} />
          实时同步到游戏
        </label>
        <div className="topbar-actions">
          <button className="btn" onClick={handleReset}>清除覆盖</button>
          <button className="btn" onClick={handleCopy}>复制为文本</button>
          <button className="btn primary" onClick={handleExport}>导出 wycwy-data.js</button>
        </div>
      </div>

      <div className="layout">
        <aside>
          {Object.entries(groups).map(([groupName, sections]) => (
            <React.Fragment key={groupName}>
              <div className="nav-label">{groupName}</div>
              {sections.map((s) => (
                <button
                  key={s.id}
                  className={`nav-item ${s.id === sectionId ? 'active' : ''}`}
                  onClick={() => setSectionId(s.id)}
                >
                  {s.label}
                  {Array.isArray(data[s.id]) && <span className="badge">{data[s.id].length}</span>}
                </button>
              ))}
            </React.Fragment>
          ))}
        </aside>

        <main>
          <div className="panel-h">
            <h2>{section.label}</h2>
            <p>{section.desc}</p>
            {section.notes && (
              <div className="section-note">
                {section.notes.map((note) => <span key={note} className="note-chip">{note}</span>)}
              </div>
            )}
          </div>
          {section.type === 'overview' ? (
            <BalanceOverview data={data} onJump={setSectionId} />
          ) : section.type === 'object' ? (
            <ObjectEditor section={section} data={data[section.id]} onChange={updateSection} />
          ) : (
            <ArrayTableEditor section={section} data={data[section.id]} onChange={updateSection} />
          )}
        </main>
      </div>

      {toast && <div className="toast">{toast}</div>}

      {showExport && (
        <div className="modal-bg" onClick={() => setShowExport(false)}>
          <div className="modal-c" onClick={(e) => e.stopPropagation()}>
            <h2 style={{marginTop: 0}}>导出文本(已复制到剪贴板)</h2>
            <p style={{color: 'var(--ink-2)', fontSize: 14}}>
              贴到 <code>wycwy-data.js</code> 完全覆盖,然后刷新游戏。
            </p>
            <textarea readOnly value={exportDataJs(data)} />
            <div style={{marginTop: 12, textAlign: 'right'}}>
              <button className="btn" onClick={() => setShowExport(false)}>关闭</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
