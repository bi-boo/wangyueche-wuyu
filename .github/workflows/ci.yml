name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build engine
        run: node scripts/build-engine.mjs

      - name: Check JavaScript syntax
        run: |
          node --check wycwy-data.js
          node --check wycwy-engine.js
          node --check scripts/ai-review-server.mjs
          node --check scripts/build-engine.mjs
          node --check scripts/build-entry-assets.mjs
          node --check scripts/smoke-server.mjs

      - name: Build entry assets
        run: node scripts/build-entry-assets.mjs

      - name: Check generated assets are current
        run: git diff --exit-code -- wycwy-engine.js dist/wycwy-app.bundle.js dist/wycwy-styles.bundle.css dist/entry-assets-manifest.json

      - name: Run server smoke test
        run: node scripts/smoke-server.mjs
